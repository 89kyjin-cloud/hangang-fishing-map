const map = L.map('map').setView([37.53,126.99], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

const bridgeLayer = L.geoJSON(bridgeGeoJSON, {
  style: { color:'#2563eb', weight:2, fillColor:'#60a5fa', fillOpacity:0.18 },
  onEachFeature: (f,l) => l.bindPopup('<b>'+ (f.properties.selected_name || f.properties.name) +'</b><br>OSM 교량 형상')
}).addTo(map);
const baseLayer = L.geoJSON(baselineGeoJSON, { style: { color:'#111827', weight:3, dashArray:'6,6' } }).addTo(map);

const poleLayer = L.layerGroup().addTo(map);
const markers = {};
function poleIcon(n) {
  return L.divIcon({ className:'', html:`<div class="pole-label">${n}</div>`, iconSize:[22,22], iconAnchor:[11,11] });
}
for (const p of poleData) {
  const key = p.bridge + '_' + p.pole;
  const m = L.marker(p.latlng, {icon:poleIcon(p.pole)})
    .bindPopup(`<b>${p.bridge} ${p.pole}번 폴대</b><br>${p.note}`);
  markers[key]=m;
  m.addTo(poleLayer);
}

const bridges = [...new Set(poleData.map(p=>p.bridge))];
const sel = document.getElementById('bridgeSelect');
bridges.forEach(b => { const o=document.createElement('option'); o.value=b; o.textContent=b; sel.appendChild(o); });
sel.value='한강대교';

function goPole() {
  const b=sel.value; const n=parseInt(document.getElementById('poleInput').value,10);
  const m=markers[b+'_'+n];
  if (!m) return alert('해당 폴대 데이터가 없습니다.');
  map.setView(m.getLatLng(), 18);
  m.openPopup();
}
function togglePoles() {
  const btn=document.getElementById('toggleBtn');
  if (map.hasLayer(poleLayer)) { map.removeLayer(poleLayer); btn.textContent='폴대 보이기'; }
  else { map.addLayer(poleLayer); btn.textContent='폴대 숨기기'; }
}
map.fitBounds(bridgeLayer.getBounds(), {padding:[20,20]});
</script>
