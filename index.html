<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한강 낚시금지구역 지도</title>
<style>
:root{--green:#08753b;--green2:#0a8a45;--pink:#e90065;--bg:#f7f8f6;--panel:390px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:#181818;background:var(--bg)}
header{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(90deg,#08753b,#0a8a45);color:#fff;box-shadow:0 2px 10px #0002;z-index:30;position:relative}
.logo{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;color:var(--pink)}
header h1{font-size:20px;margin:0;white-space:nowrap} header .sub{margin-left:auto;font-size:13px;opacity:.95}
.app{height:calc(100dvh - 58px);display:grid;grid-template-columns:1fr var(--panel);transition:grid-template-columns .25s ease}
.app.closed{grid-template-columns:1fr 0px}
#viewer{position:relative;overflow:hidden;background:#eee;touch-action:none;cursor:grab}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#map{width:3072px;height:2040px;display:block;max-width:none;filter:contrast(1.06) saturate(1.04);}
#markerLayer{position:absolute;inset:0;pointer-events:none;z-index:10}
.marker{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;line-height:1;border:2px solid #fff;box-shadow:0 2px 8px #0007;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer}
.marker.active{outline:4px solid #ffd54d;z-index:12}
.map-controls{position:absolute;left:14px;bottom:98px;z-index:15;display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 2px 12px #0002;overflow:hidden}
.map-controls button{width:48px;height:48px;border:0;background:#fff;font-size:28px;border-bottom:1px solid #eee;cursor:pointer}
.map-controls button:last-child{border-bottom:0;font-size:18px}
.tip{position:absolute;left:14px;bottom:18px;z-index:15;background:#fff9e6;border:1px solid #f0cf78;border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 2px 12px #0001;max-width:360px}
.panel{background:#fff;border-left:1px solid #ddd;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s ease,opacity .2s ease;z-index:20}
.app.closed .panel{transform:translateX(100%);opacity:0}
.panel-head{padding:16px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}
.panel-head h2{font-size:20px;margin:0;color:var(--green)} .panel-head p{margin:2px 0 0;font-size:13px;color:#555}
.toggle{margin-left:auto;border:2px solid var(--green);background:#fff;color:var(--green);border-radius:12px;width:46px;height:42px;font-size:24px;font-weight:800;cursor:pointer}
.floating-open{position:absolute;right:10px;top:50%;z-index:19;border:2px solid var(--green);background:#fff;color:var(--green);width:44px;height:70px;border-radius:14px;font-size:28px;box-shadow:0 2px 12px #0002;display:none}
.app.closed .floating-open{display:block}
.search{padding:0 16px 12px} input{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px}
.list{padding:0 16px 12px;overflow:auto;flex:1}
.card{border:1px solid #ddd;border-radius:14px;margin:10px 0;background:#fff;overflow:hidden}
.card.active{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.card-title{width:100%;text-align:left;border:0;background:#fff;display:flex;gap:10px;align-items:center;padding:14px;cursor:pointer}
.badge{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.name{font-size:17px;font-weight:900;color:var(--pink)} .arrow{margin-left:auto;font-size:22px;transition:transform .2s}
.card.open .arrow{transform:rotate(90deg)}
.desc{display:none;padding:0 14px 14px 54px;font-size:15px;line-height:1.55}
.card.open .desc{display:block}
.bottom-info{border-top:1px solid #eee;padding:14px 16px;font-size:13px;line-height:1.5;background:#fafafa;max-height:34%;overflow:auto}
.bottom-info h3{margin:8px 0 4px;color:var(--green);font-size:15px}
.close-bottom{padding:10px 16px;border-top:1px solid #eee;background:#fff}
.close-bottom button{width:100%;border:1px solid var(--green);border-radius:10px;background:#fff;color:var(--green);padding:10px;font-weight:800;font-size:16px}
@media(max-width:850px){
 header h1{font-size:17px} header .sub{display:none}
 .app{grid-template-columns:1fr}
 .panel{position:absolute;right:0;top:58px;bottom:0;width:min(88vw,390px);box-shadow:-5px 0 20px #0002}
 .app.closed{grid-template-columns:1fr}
 .tip{font-size:13px;left:10px;right:72px;bottom:12px}
 .map-controls{left:10px;bottom:92px}
}
</style>
</head>

let scale=.35,x=12,y=12,active=null; const pointers=new Map(); let lastPan=null,lastPinchDist=null,lastPinchMid=null;
function update(){stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`; updateMarkers();}
function updateMarkers(){markerLayer.innerHTML=''; zones.forEach(z=>{const d=document.createElement('button');d.className='marker'+(z.id===active?' active':'');d.textContent=z.id;d.style.left=(x+z.x*scale)+'px';d.style.top=(y+z.y*scale)+'px';d.onclick=(e)=>{e.stopPropagation();selectZone(z.id)};markerLayer.appendChild(d);})}
function clamp(v){return Math.max(.12,Math.min(4,v));}
function setScaleAround(ns,cx,cy){ns=clamp(ns);const mx=(cx-x)/scale,my=(cy-y)/scale;scale=ns;x=cx-mx*scale;y=cy-my*scale;update();}
function zoomBy(f){const r=viewer.getBoundingClientRect();setScaleAround(scale*f,r.width/2,r.height/2);}
function resetView(){scale=Math.min(viewer.clientWidth/3072,viewer.clientHeight/2040)*.98;x=10;y=10;update();}
function setPanel(closed){app.classList.toggle('closed',closed);setTimeout(()=>{resetView();},260)}
function selectZone(id){active=id; const z=zones.find(a=>a.id===id); if(z){scale=Math.max(scale,.72);x=viewer.clientWidth/2-z.x*scale;y=viewer.clientHeight/2-z.y*scale;} update(); renderList(); if(window.innerWidth<850) setPanel(false);}
function renderList(){const q=document.getElementById('search').value.trim().toLowerCase(); const list=document.getElementById('list'); list.innerHTML=''; zones.filter(z=>(z.id+'번 '+z.name+' '+z.desc).toLowerCase().includes(q)).forEach(z=>{const c=document.createElement('div'); c.className='card '+(z.id===active?'active open':''); c.innerHTML=`<button class="card-title"><span class="badge">${z.id}</span><span class="name">${z.name}</span><span class="arrow">›</span></button><div class="desc">${z.desc}</div>`; c.querySelector('button').onclick=()=>{ if(active===z.id && c.classList.contains('open')){c.classList.remove('open')} else {active=z.id; selectZone(z.id)} }; list.appendChild(c);})}
viewer.addEventListener('wheel',e=>{e.preventDefault();const r=viewer.getBoundingClientRect();setScaleAround(scale*(e.deltaY<0?1.12:.89),e.clientX-r.left,e.clientY-r.top)},{passive:false});
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)} function mid(a,b){return {clientX:(a.clientX+b.clientX)/2,clientY:(a.clientY+b.clientY)/2}}
viewer.addEventListener('pointerdown',e=>{viewer.setPointerCapture(e.pointerId);pointers.set(e.pointerId,e); if(pointers.size===1)lastPan={clientX:e.clientX,clientY:e.clientY}; if(pointers.size===2){const p=[...pointers.values()];lastPinchDist=dist(p[0],p[1]);lastPinchMid=mid(p[0],p[1]);lastPan=null;}});
viewer.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,e); if(pointers.size===1&&lastPan){x+=e.clientX-lastPan.clientX;y+=e.clientY-lastPan.clientY;lastPan={clientX:e.clientX,clientY:e.clientY};update();} if(pointers.size===2){const p=[...pointers.values()],nd=dist(p[0],p[1]),nm=mid(p[0],p[1]),r=viewer.getBoundingClientRect(); if(lastPinchDist&&lastPinchMid){x+=nm.clientX-lastPinchMid.clientX;y+=nm.clientY-lastPinchMid.clientY;setScaleAround(scale*(nd/lastPinchDist),nm.clientX-r.left,nm.clientY-r.top)} lastPinchDist=nd;lastPinchMid=nm;}});
function endPointer(e){pointers.delete(e.pointerId); if(pointers.size===1){const p=[...pointers.values()][0];lastPan={clientX:p.clientX,clientY:p.clientY};lastPinchDist=null;} else {lastPan=null;lastPinchDist=null;lastPinchMid=null;}}
viewer.addEventListener('pointerup',endPointer);viewer.addEventListener('pointercancel',endPointer);
window.addEventListener('resize',resetView); resetView(); renderList();
</script>
