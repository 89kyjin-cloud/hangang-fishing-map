<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한강 낚시금지구역 실사용 GPS 지도</title>
<style>
:root{--green:#0b6f3a;--green2:#11864b;--red:#e90068;--blue:#1677ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;overflow:hidden;background:#edf3ef}
header{height:54px;background:linear-gradient(90deg,var(--green),var(--green2));color:white;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 2px 10px #0002;z-index:1000;position:relative}
h1{font-size:17px;margin:0} header span{font-size:12px;opacity:.9}
#map{position:relative;width:100vw;height:calc(100vh - 54px);overflow:hidden;touch-action:none;background:linear-gradient(#f7faf7,#e8f1ea)}
.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;background:#f2f2f2}

#svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:auto}
.locBtn{position:absolute;right:12px;top:66px;z-index:1000;border:0;border-radius:999px;background:white;color:var(--green);font-weight:900;padding:11px 15px;box-shadow:0 4px 16px #0003;font-size:14px}
.listBtn{position:absolute;right:12px;top:116px;z-index:1000;border:0;border-radius:999px;background:white;color:var(--green);font-weight:900;padding:10px 14px;box-shadow:0 4px 16px #0003;font-size:13px}
.legend{position:absolute;left:12px;top:66px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid #d9e5d9;border-radius:14px;box-shadow:0 4px 16px #0002;padding:10px 12px;font-size:12px;line-height:1.4;max-width:280px}
.legend b{color:var(--green)}

.status b{color:var(--green)}
.label{position:absolute;transform:translate(-50%,-50%);background:var(--red);color:#fff;border:2px solid #fff;border-radius:999px;width:28px;height:28px;text-align:center;line-height:24px;font-weight:900;box-shadow:0 2px 8px #0005;z-index:6;font-size:13px;cursor:pointer}
.label.active{width:38px;height:38px;line-height:34px;font-size:16px;box-shadow:0 0 0 8px rgba(233,0,104,.18),0 4px 14px #0005}
.userDot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--blue);border:3px solid white;border-radius:999px;box-shadow:0 0 0 7px rgba(22,119,255,.20),0 3px 12px #0005;z-index:10}
.accCircle{position:absolute;border:1px solid var(--blue);background:rgba(22,119,255,.08);border-radius:50%;z-index:9;pointer-events:none}
.popup,.zonePanel{position:absolute;display:none;right:12px;top:166px;z-index:1002;width:min(390px,calc(100vw - 24px));max-height:56vh;overflow:auto;background:white;border:1px solid #ddd;border-radius:16px;box-shadow:0 8px 28px #0003;padding:14px;line-height:1.45;font-size:14px}
.popup b,.zonePanel b{color:var(--red)}
.close{position:sticky;float:right;top:0;border:1px solid #ddd;background:#fff;color:var(--green);border-radius:8px;width:30px;height:30px;font-weight:900}
.zoneItem{border:1px solid #eee;border-radius:12px;margin:7px 0;padding:9px 10px;background:#fff;cursor:pointer}
.zoomCtl{position:absolute;right:12px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:1000;display:flex;flex-direction:column;gap:6px}
.zoomCtl button{width:44px;height:44px;border:0;border-radius:12px;background:white;color:var(--green);font-size:24px;font-weight:900;box-shadow:0 3px 12px #0003}
@media(max-width:700px){header span{display:none}h1{font-size:16px}.legend{font-size:11px;max-width:230px}.status{font-size:12px}.locBtn{font-size:13px;padding:10px 13px}.listBtn{top:112px}.popup,.zonePanel{top:156px;max-height:50vh}}
</style>

<body>
<header><h1>🚫 한강 낚시금지구역 실사용 GPS 지도</h1><span>미래한강본부 24개 구간 직접 설정 · GPS 판정</span></header>
<div id="map"><div id="tiles"></div><div id="overlay"><svg id="svg"></svg></div></div>
<button class="locBtn" onclick="locateMe()">📍 내 위치</button>
<button class="listBtn" onclick="togglePanel()">📋 구역목록</button>
<div class="zoomCtl"><button onclick="setZoom(zoom+1)">＋</button><button onclick="setZoom(zoom-1)">－</button></div>
<div class="legend"><b>사용 방법</b><br>분홍색 구간은 미래한강본부 설명을 실지도에 직접 설정한 금지구역입니다.<br>내 위치를 누르면 해당 구간 기준으로 판정합니다.</div>
<div id="popup" class="popup"><button class="close" onclick="closePopup()">×</button><div id="popupText"></div></div>
<div id="zonePanel" class="zonePanel"><button class="close" onclick="togglePanel(false)">×</button><h3 style="margin:0 0 8px;color:var(--green)">공식 낚시금지구역 24개</h3><div id="zoneList"></div></div>
<div id="status" class="status">📍 <b>내 위치</b> 버튼을 눌러 현재 위치를 확인하세요.<br><small>※ 현장 안내판·통제선·최신 고시가 최종 우선입니다.</small></div>
<script>
const zones=[{"id": 1, "name": "뚝섬 1지역", "desc": "자양2동 잠실수중보 ~ 청담대교 상류 약 670m 사이 한강호안 및 내수면", "width": 220, "path": [[37.5207, 127.1045], [37.522, 127.095], [37.5233, 127.0845], [37.5244, 127.074], [37.5252, 127.064]]}, {"id": 2, "name": "뚝섬 2지역", "desc": "청담대교 북단 상류 450m ~ 성수동 영동대교 북단 하류 710m 사이 한강호안 및 내수면", "width": 210, "path": [[37.5252, 127.064], [37.5262, 127.057], [37.5275, 127.05], [37.5292, 127.0428]]}, {"id": 3, "name": "뚝섬 3지역", "desc": "서울숲 회전 고가시설 ~ 중랑천 합류부 사이 한강호안 및 내수면", "width": 210, "path": [[37.5292, 127.0428], [37.5324, 127.039], [37.5366, 127.0368], [37.541, 127.036]]}, {"id": 4, "name": "이촌 1지역", "desc": "중랑천 합류부 ~ 동호대교 북단 하류 300m 사이 한강호안 및 내수면", "width": 210, "path": [[37.541, 127.036], [37.537, 127.0295], [37.5325, 127.022], [37.5292, 127.016]]}, {"id": 5, "name": "이촌 2지역", "desc": "동호대교 북단 하류 800m ~ 한남대교 북단 상류 380m 사이 한강호안 및 내수면(전망로 포함)", "width": 210, "path": [[37.5292, 127.016], [37.5272, 127.0088], [37.5251, 127.0012], [37.5233, 126.995]]}, {"id": 6, "name": "이촌 3지역", "desc": "노들섬 전체, 한강대교 북단 상류 900m ~ 한강대교 북단 교량 사이 한강호안 및 내수면", "width": 250, "path": [[37.5225, 126.972], [37.52, 126.966], [37.5173, 126.96], [37.5148, 126.9548]]}, {"id": 7, "name": "밤섬지역", "desc": "밤섬 전체 및 마포대교 북단 상류 650m ~ 당산철교 북단 상류 500m 사이 한강호안 및 내수면", "width": 360, "path": [[37.536, 126.934], [37.5348, 126.926], [37.535, 126.917], [37.536, 126.9085]]}, {"id": 8, "name": "망원 1지역", "desc": "양화대교 북단 교량 ~ 합정동 양화대교 북단 하류 550m 사이 한강호안 및 내수면", "width": 220, "path": [[37.5442, 126.912], [37.5429, 126.906], [37.5422, 126.9]]}, {"id": 9, "name": "망원 2지역", "desc": "성산대교 북단 상류 600m 교량 ~ 홍제천 합류부 사이 한강호안 및 내수면", "width": 240, "path": [[37.5485, 126.9], [37.552, 126.8935], [37.5564, 126.887]]}, {"id": 10, "name": "망원 3지역", "desc": "당산철교 북단 상류 500m ~ 당산철교 북단 교량 사이 한강호안 및 내수면", "width": 200, "path": [[37.5389, 126.914], [37.538, 126.909], [37.5372, 126.904]]}, {"id": 11, "name": "난지 1지역", "desc": "홍제천교 ~ 성산대교 북단 하류 1,300m 사이 한강호안 및 내수면", "width": 270, "path": [[37.5564, 126.887], [37.5605, 126.881], [37.5632, 126.876], [37.5665, 126.8715]]}, {"id": 12, "name": "난지 2지역", "desc": "가양대교 북단 상류 800m ~ 가양대교 북단 하류 450m 사이 한강호안 및 내수면", "width": 310, "path": [[37.5665, 126.8715], [37.5695, 126.862], [37.571, 126.852], [37.572, 126.8425]]}, {"id": 13, "name": "난지 3지역", "desc": "월드컵대교 북단 하류 750m ~ 월드컵대교 북단 하류 900m 사이 한강호안 및 내수면", "width": 160, "path": [[37.5574, 126.884], [37.5584, 126.881], [37.5593, 126.8787]]}, {"id": 14, "name": "잠실지역", "desc": "잠실5동 잠실수중보 ~ 잠실수중보 하류 1,300m 사이 한강호안 및 내수면", "width": 360, "path": [[37.5207, 127.1045], [37.526, 127.111], [37.534, 127.116], [37.542, 127.114], [37.547, 127.1085]]}, {"id": 15, "name": "잠원1지역", "desc": "동호대교 남단 하류 300m ~ 한남대교 남단 하류 1,000m 사이 한강호안 및 내수면", "width": 230, "path": [[37.521, 127.022], [37.5192, 127.014], [37.5185, 127.006], [37.5177, 126.9988]]}, {"id": 16, "name": "반포 1지역", "desc": "반포동 반포대교 남단 상류 200m ~ 하류 500m 사이 한강호안 및 내수면", "width": 220, "path": [[37.5154, 126.9998], [37.512, 126.995], [37.5107, 126.9892]]}, {"id": 17, "name": "반포 2지역", "desc": "동작대교 남단 상류 450m ~ 동작대교 남단 하류 280m 사이 한강호안 및 내수면", "width": 220, "path": [[37.512, 126.9848], [37.5107, 126.9785], [37.5097, 126.9725]]}, {"id": 18, "name": "흑석지역", "desc": "한강대교 남단 상류 1,360m ~ 본동 한강철교 남단 상류 400m 사이 한강호안 및 내수면", "width": 240, "path": [[37.51, 126.9725], [37.5084, 126.9625], [37.5077, 126.956], [37.508, 126.947]]}, {"id": 19, "name": "여의도 1지역", "desc": "원효대교 남단 상류 430m ~ 서강대교 남단 하류 370m 사이 한강호안 및 내수면", "width": 280, "path": [[37.5268, 126.947], [37.5264, 126.936], [37.5288, 126.9232]]}, {"id": 20, "name": "여의도 2지역", "desc": "여의도동 샛강 내수면 전역(상·하류 합류부 및 연결한 내수면 포함)", "width": 260, "path": [[37.5195, 126.945], [37.5187, 126.936], [37.5188, 126.927], [37.5204, 126.915]]}, {"id": 21, "name": "양화 1지역", "desc": "당산철교 남단 상류 370m ~ 당산철교 남단 60m 사이 한강호안 및 내수면", "width": 210, "path": [[37.533, 126.9125], [37.5327, 126.9062], [37.5325, 126.9028]]}, {"id": 22, "name": "양화 2지역", "desc": "선유도공원 전체 및 성산대교 남단 상류 600m ~ 안양천 합류부 상류 150m 사이 한강호안 및 내수면", "width": 330, "path": [[37.5435, 126.904], [37.542, 126.8958], [37.5412, 126.887], [37.5408, 126.878]]}, {"id": 23, "name": "양화3, 강서 1지역", "desc": "염창동 안양천 합류부 하류 150m ~ 마곡철교 남단 하류 400m 사이 한강호안 및 내수면", "width": 340, "path": [[37.555, 126.867], [37.555, 126.8515], [37.558, 126.835], [37.566, 126.817]]}, {"id": 24, "name": "강서 2지역", "desc": "방화대교 남단 하류 50m ~ 행주대교 남단 상류 400m 사이 한강호안 및 내수면", "width": 340, "path": [[37.566, 126.817], [37.575, 126.811], [37.585, 126.81], [37.595, 126.809]]}];
const mapEl=document.getElementById('map'), tilesEl=document.getElementById('tiles'), svg=document.getElementById('svg');
let zoom=13, center={lat:37.535,lng:126.98}, dragging=false,last=null,userMarker=null,accEl=null,activeId=null,tileHost=0;
const HOSTS=['https://tile.openstreetmap.org/{z}/{x}/{y}.png','https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png'];

function project(lat,lng,z=zoom){const sin=Math.sin(lat*Math.PI/180),n=256*Math.pow(2,z);return {x:(lng+180)/360*n,y:(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*n}}
function unproject(x,y,z=zoom){const n=256*Math.pow(2,z),lng=x/n*360-180,lat=(180/Math.PI)*(2*Math.atan(Math.exp((0.5-y/n)*2*Math.PI))-Math.PI/2);return {lat,lng}}
function centerPx(){return project(center.lat,center.lng)}
function sp(lat,lng){const p=project(lat,lng),c=centerPx();return {x:mapEl.clientWidth/2+p.x-c.x,y:mapEl.clientHeight/2+p.y-c.y}}
function mpp(lat=center.lat){return 156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,zoom)}
function redraw(){drawTiles();drawZones();drawUser()}
function drawTiles(){const c=centerPx(),w=mapEl.clientWidth,h=mapEl.clientHeight,max=Math.pow(2,zoom);let html='',tpl=HOSTS[tileHost%HOSTS.length];const sx=Math.floor((c.x-w/2)/256)-1,ex=Math.floor((c.x+w/2)/256)+1,sy=Math.floor((c.y-h/2)/256)-1,ey=Math.floor((c.y+h/2)/256)+1;for(let x=sx;x<=ex;x++)for(let y=sy;y<=ey;y++){if(y<0||y>=max)continue;const tx=((x%max)+max)%max,left=x*256-c.x+w/2,top=y*256-c.y+h/2,src=tpl.replace('{z}',zoom).replace('{x}',tx).replace('{y}',y);html+=`<img class="tile" src="${src}" style="left:${left}px;top:${top}px" onerror="this.style.display='none'">`;}tilesEl.innerHTML=html}
function makeSvgEl(n,a){const el=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>el.setAttribute(k,v));return el}
function drawZones(){document.querySelectorAll('.label').forEach(e=>e.remove());svg.innerHTML='';zones.forEach(z=>{const pts=z.path.map(p=>sp(p[0],p[1]));const d=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');const px=Math.max(14,Math.min(42,z.width*1.6/mpp(z.path[0][0])));svg.appendChild(makeSvgEl('path',{d,stroke:'#e90068','stroke-width':px,opacity:.18,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'}));const line=makeSvgEl('path',{d,stroke:'#e90068','stroke-width':Math.max(5,Math.min(13,px/3)),opacity:.9,fill:'none','stroke-linecap':'round','stroke-linejoin':'round',style:'cursor:pointer;pointer-events:auto'});line.addEventListener('click',()=>showZone(z));svg.appendChild(line);const mid=z.path[Math.floor(z.path.length/2)],p=sp(mid[0],mid[1]);const lab=document.createElement('div');lab.className='label'+(activeId===z.id?' active':'');lab.textContent=z.id;lab.style.left=p.x+'px';lab.style.top=p.y+'px';lab.onclick=()=>showZone(z);mapEl.appendChild(lab)})}
function setZoom(z){zoom=Math.max(10,Math.min(18,z));redraw()}
function panBy(dx,dy){const c=centerPx();center=unproject(c.x-dx,c.y-dy);redraw()}
function distancePointToSegmentMeters(lat,lng,lat1,lng1,lat2,lng2){const R=6371000,toRad=Math.PI/180,x=lng*toRad*Math.cos(lat*toRad)*R,y=lat*toRad*R,x1=lng1*toRad*Math.cos(lat*toRad)*R,y1=lat1*toRad*R,x2=lng2*toRad*Math.cos(lat*toRad)*R,y2=lat2*toRad*R,dx=x2-x1,dy=y2-y1;if(dx===0&&dy===0)return Math.hypot(x-x1,y-y1);let t=((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(x-(x1+t*dx),y-(y1+t*dy))}
function distanceToZone(lat,lng,z){let best=Infinity;for(let i=0;i<z.path.length-1;i++)best=Math.min(best,distancePointToSegmentMeters(lat,lng,z.path[i][0],z.path[i][1],z.path[i+1][0],z.path[i+1][1]));return best}
function judge(lat,lng){return zones.map(z=>{const dist=distanceToZone(lat,lng,z);return {...z,dist,inside:dist<=z.width}}).sort((a,b)=>a.dist-b.dist)}
function showZone(z){activeId=z.id;const mid=z.path[Math.floor(z.path.length/2)];center={lat:mid[0],lng:mid[1]};zoom=Math.max(zoom,15);redraw();document.getElementById('popupText').innerHTML=`<b>${z.id}. ${z.name}</b><br>${z.desc}<br><small>※ 미래한강본부 공식 설명을 실지도에 직접 설정한 보조 구간입니다.</small>`;document.getElementById('popup').style.display='block'}
function closePopup(){document.getElementById('popup').style.display='none'}
function renderList(){const l=document.getElementById('zoneList');l.innerHTML='';zones.forEach(z=>{const d=document.createElement('div');d.className='zoneItem';d.innerHTML=`<b>${z.id}. ${z.name}</b><br><small>${z.desc}</small>`;d.onclick=()=>{togglePanel(false);showZone(z)};l.appendChild(d)})}
function togglePanel(force){const p=document.getElementById('zonePanel');p.style.display=force===false?'none':(p.style.display==='block'?'none':'block')}
function drawUser(){if(!userMarker)return;const p=sp(userMarker.lat,userMarker.lng);userMarker.el.style.left=p.x+'px';userMarker.el.style.top=p.y+'px';const r=Math.max(10,userMarker.acc/mpp(userMarker.lat));accEl.style.left=(p.x-r)+'px';accEl.style.top=(p.y-r)+'px';accEl.style.width=(r*2)+'px';accEl.style.height=(r*2)+'px'}
function updateLocation(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy||0;center={lat,lng};zoom=Math.max(zoom,16);if(!userMarker){const el=document.createElement('div');el.className='userDot';mapEl.appendChild(el);accEl=document.createElement('div');accEl.className='accCircle';mapEl.appendChild(accEl);userMarker={el,lat,lng,acc}}else{userMarker.lat=lat;userMarker.lng=lng;userMarker.acc=acc}const j=judge(lat,lng),near=j[0];activeId=near.id;redraw();let html='';if(near.inside)html=`🔴 <b>낚시금지구역 안으로 추정됩니다.</b><br>해당 구역: <b>${near.id}. ${near.name}</b><br>구역선까지 거리: 약 ${Math.round(near.dist)}m<br>`;else if(near.dist<=near.width+80)html=`🟠 <b>금지구역 경계 근처입니다.</b><br>가장 가까운 구역: <b>${near.id}. ${near.name}</b><br>구역선까지 거리: 약 ${Math.round(near.dist)}m<br>`;else html=`🟢 <b>등록된 금지구역 밖으로 추정됩니다.</b><br>가장 가까운 구역: <b>${near.id}. ${near.name}</b><br>구역선까지 거리: 약 ${Math.round(near.dist)}m<br>`;html+=`GPS 정확도: ±${Math.round(acc)}m<br>좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br><small>※ 실사용 보조판정입니다. 현장 안내판·통제선·최신 고시가 최종 우선입니다.</small>`;document.getElementById('status').innerHTML=html}
function locateMe(){const st=document.getElementById('status');if(!navigator.geolocation){st.innerHTML='GPS를 지원하지 않습니다.';return}st.innerHTML='📍 위치 확인 중입니다. 권한 요청이 뜨면 허용을 눌러주세요.';navigator.geolocation.getCurrentPosition(updateLocation,e=>{st.innerHTML='<b>위치 확인 실패</b><br>'+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
mapEl.addEventListener('pointerdown',e=>{dragging=true;last={x:e.clientX,y:e.clientY};mapEl.setPointerCapture(e.pointerId)});mapEl.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};panBy(dx,dy)});mapEl.addEventListener('pointerup',()=>dragging=false);mapEl.addEventListener('pointercancel',()=>dragging=false);mapEl.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom+(e.deltaY<0?1:-1))},{passive:false});window.addEventListener('resize',redraw);
renderList();redraw();setTimeout(()=>{tileHost=1;drawTiles()},2500);
</script>
