300, "path": [[37.556, 126.887], [37.5595, 126.8815], [37.5625, 126.879], [37.5665, 126.874]]}, {"id": 12, "name": "난지 2지역", "desc": "가양대교 북단 상류 800m(난지캠핑장 끝 호안 하류 측) ~ 가양대교 북단 하류 450m 사이의 한강호안 및 내수면(생태습지원 엄격한 내수면 포함)", "width": 340, "path": [[37.5665, 126.874], [37.5695, 126.864], [37.5715, 126.8527], [37.572, 126.8435]]}, {"id": 13, "name": "난지 3지역", "desc": "월드컵대교 북단 하류 750m ~ 월드컵대교 북단 하류 900m 사이의 한강호안 및 내수면", "width": 180, "path": [[37.5575, 126.884], [37.5585, 126.881], [37.5595, 126.8785]]}, {"id": 14, "name": "잠실지역", "desc": "잠실5동 잠실수중보 ~ 잠실수중보 하류 1,300m 사이의 한강호안 및 내수면", "width": 380, "path": [[37.5205, 127.0955], [37.523, 127.104], [37.529, 127.112], [37.538, 127.116], [37.545, 127.111]]}, {"id": 15, "name": "잠원1지역", "desc": "동호대교 남단 하류 300m(리버시티) ~ 한남대교 남단 하류 1,000m(요트클럽 하류 100m) 사이의 한강호안 및 내수면", "width": 250, "path": [[37.5205, 127.022], [37.5192, 127.014], [37.5187, 127.006], [37.5178, 126.999]]}, {"id": 16, "name": "반포 1지역", "desc": "반포동 반포대교 남단 상류 200m(전망데크) ~ 하류 500m(임시선착장) 사이의 한강호안 및 내수면", "width": 230, "path": [[37.5152, 126.999], [37.512, 126.995], [37.5108, 126.9895]]}, {"id": 17, "name": "반포 2지역", "desc": "동작대교 남단 상류 450m(서래섬 하류 100m) ~ 동작대교 남단 하류 280m 사이의 한강호안 및 내수면", "width": 240, "path": [[37.512, 126.9845], [37.5107, 126.9785], [37.5095, 126.9725]]}, {"id": 18, "name": "흑석지역", "desc": "한강대교 남단 상류 1,360m(한강현대아파트 114동 앞) ~ 본동 한강철교 남단 상류 400m 사이의 한강호안 및 내수면", "width": 260, "path": [[37.5095, 126.9725], [37.5077, 126.956], [37.5082, 126.9465]]}, {"id": 19, "name": "여의도 1지역", "desc": "원효대교 남단 상류 430m ~ 서강대교 남단 하류 370m 사이의 한강호안 및 내수면", "width": 300, "path": [[37.5268, 126.947], [37.5263, 126.935], [37.529, 126.9225]]}, {"id": 20, "name": "여의도 2지역", "desc": "여의도동 샛강 내수면 전역(상·하류 합류부 및 연결한 내수면 포함)", "width": 260, "path": [[37.5188, 126.944], [37.5188, 126.935], [37.5188, 126.927], [37.52, 126.9155]]}, {"id": 21, "name": "양화 1지역", "desc": "당산철교 남단 상류 370m(여의도 샛강 하류 합류부) ~ 당산철교 남단 60m(해양소년단 수상훈련장)의 한강호안 및 내수면", "width": 230, "path": [[37.5327, 126.912], [37.5327, 126.9062], [37.5325, 126.903]]}, {"id": 22, "name": "양화 2지역", "desc": "선유도공원 전체 및 성산대교 남단 상류 600m ~ 안양천 합류부 상류 150m 사이의 한강호안 및 내수면", "width": 320, "path": [[37.5435, 126.904], [37.542, 126.8958], [37.541, 126.8865], [37.5405, 126.878]]}, {"id": 23, "name": "양화3, 강서 1지역", "desc": "염창동 안양천 합류부 하류 150m ~ 마곡철교 남단 하류 400m 사이의 한강호안 및 내수면", "width": 360, "path": [[37.555, 126.867], [37.555, 126.8515], [37.558, 126.835], [37.566, 126.817]]}, {"id": 24, "name": "강서 2지역", "desc": "방화대교 남단 하류 50m ~ 행주대교 남단 상류 400m 사이의 한강호안 및 내수면", "width": 360, "path": [[37.566, 126.817], [37.575, 126.811], [37.585, 126.81], [37.595, 126.809]]}];
const mapEl=document.getElementById('map'), tilesEl=document.getElementById('tiles'), svg=document.getElementById('svg');
let zoom=13, center={lat:37.535,lng:126.98}, userMarker=null, accEl=null;
let dragging=false,last=null,pinch=null;

function project(lat,lng,z=zoom){
  const sin=Math.sin(lat*Math.PI/180);
  const n=256*Math.pow(2,z);
  return {x:(lng+180)/360*n, y:(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*n};
}
function unproject(x,y,z=zoom){
  const n=256*Math.pow(2,z);
  const lng=x/n*360-180;
  const lat=(180/Math.PI)*(2*Math.atan(Math.exp((0.5-y/n)*2*Math.PI))-Math.PI/2);
  return {lat,lng};
}
function centerPx(){return project(center.lat,center.lng)}
function screenPoint(lat,lng){
  const p=project(lat,lng), c=centerPx();
  return {x:mapEl.clientWidth/2 + (p.x-c.x), y:mapEl.clientHeight/2 + (p.y-c.y)};
}
function metersPerPixel(lat=center.lat){return 156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,zoom)}
function redraw(){
  drawTiles(); drawZones(); drawUser();
}
function drawTiles(){
  const c=centerPx(), w=mapEl.clientWidth, h=mapEl.clientHeight;
  const startX=Math.floor((c.x-w/2)/256)-1, endX=Math.floor((c.x+w/2)/256)+1;
  const startY=Math.floor((c.y-h/2)/256)-1, endY=Math.floor((c.y+h/2)/256)+1;
  const max=Math.pow(2,zoom);
  let html='';
  for(let x=startX;x<=endX;x++) for(let y=startY;y<=endY;y++){
    if(y<0||y>=max) continue;
    const tx=((x%max)+max)%max;
    const left=x*256-c.x+w/2, top=y*256-c.y+h/2;
    html+=`<img class="tile" src="https://tile.openstreetmap.org/${zoom}/${tx}/${y}.png" style="left:${left}px;top:${top}px" loading="eager">`;
  }
  tilesEl.innerHTML=html;
}
function makeSvgEl(name, attrs){
  const el=document.createElementNS('http://www.w3.org/2000/svg',name);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}
function drawZones(){
  svg.innerHTML='';
  document.querySelectorAll('.label').forEach(e=>e.remove());
  zones.forEach(z=>{
    const pts=z.path.map(p=>screenPoint(p[0],p[1]));
    const d=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const px=Math.max(16, Math.min(60, z.width*2/metersPerPixel(z.path[0][0])));
    svg.appendChild(makeSvgEl('path',{d,stroke:'#e90068','stroke-width':px,opacity:.16,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'}));
    const line=makeSvgEl('path',{d,stroke:'#e90068','stroke-width':Math.max(6,Math.min(16,px/3)),opacity:.85,fill:'none','stroke-linecap':'round','stroke-linejoin':'round',style:'cursor:pointer'});
    line.addEventListener('click',()=>showPopup(z));
    svg.appendChild(line);
    const mid=z.path[Math.floor(z.path.length/2)], sp=screenPoint(mid[0],mid[1]);
    const lab=document.createElement('div'); lab.className='label'; lab.textContent=z.id; lab.style.left=sp.x+'px'; lab.style.top=sp.y+'px'; lab.onclick=()=>showPopup(z);
    mapEl.appendChild(lab);
  });
}
function setZoom(z){
  zoom=Math.max(10,Math.min(18,z)); redraw();
}
function panBy(dx,dy){
  const c=centerPx(); center=unproject(c.x-dx,c.y-dy); redraw();
}
function showPopup(z){
  document.getElementById('popupText').innerHTML=`<b>${z.id}. ${z.name}</b><br>${z.desc}<br><small>※ 미래한강본부 자료 기반 보조 표시입니다.</small>`;
  document.getElementById('popup').style.display='block';
}
function closePopup(){document.getElementById('popup').style.display='none'}

function hav(a,b,c,d){
  const R=6371000,toRad=Math.PI/180,p1=a*toRad,p2=c*toRad,dp=(c-a)*toRad,dl=(d-b)*toRad;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function distancePointToSegmentMeters(lat,lng,lat1,lng1,lat2,lng2){
  const R=6371000,toRad=Math.PI/180;
  const x=lng*toRad*Math.cos(lat*toRad)*R,y=lat*toRad*R;
  const x1=lng1*toRad*Math.cos(lat*toRad)*R,y1=lat1*toRad*R;
  const x2=lng2*toRad*Math.cos(lat*toRad)*R,y2=lat2*toRad*R;
  const dx=x2-x1,dy=y2-y1;
  if(dx===0&&dy===0) return Math.hypot(x-x1,y-y1);
  let t=((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy); t=Math.max(0,Math.min(1,t));
  return Math.hypot(x-(x1+t*dx),y-(y1+t*dy));
}
function distanceToZone(lat,lng,z){
  let best=Infinity;
  for(let i=0;i<z.path.length-1;i++) best=Math.min(best,distancePointToSegmentMeters(lat,lng,z.path[i][0],z.path[i][1],z.path[i+1][0],z.path[i+1][1]));
  return best;
}
function judgeZones(lat,lng){
  return zones.map(z=>{const dist=distanceToZone(lat,lng,z);return {...z,dist,inside:dist<=z.width}}).sort((a,b)=>a.dist-b.dist);
}
function drawUser(){
  if(!userMarker) return;
  const p=screenPoint(userMarker.lat,userMarker.lng);
  userMarker.el.style.left=p.x+'px'; userMarker.el.style.top=p.y+'px';
  const r=userMarker.acc/metersPerPixel(userMarker.lat);
  accEl.style.left=(p.x-r)+'px'; accEl.style.top=(p.y-r)+'px'; accEl.style.width=(r*2)+'px'; accEl.style.height=(r*2)+'px';
}
function updateLocation(pos){
  const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy||0;
  center={lat,lng}; zoom=Math.max(zoom,16);
  if(!userMarker){
    const el=document.createElement('div'); el.className='userDot'; mapEl.appendChild(el);
    accEl=document.createElement('div'); accEl.className='accCircle'; mapEl.appendChild(accEl);
    userMarker={el,lat,lng,acc};
  } else {userMarker.lat=lat;userMarker.lng=lng;userMarker.acc=acc;}
  redraw();
  const judged=judgeZones(lat,lng), inside=judged.filter(z=>z.inside), nearest=judged[0];
  let html='';
  if(inside.length) html=`🔴 <b>낚시금지구역 안으로 추정됩니다.</b><br>해당 구역: <b>${inside[0].id}. ${inside[0].name}</b><br>구역선까지 거리: 약 ${Math.round(inside[0].dist)}m<br>`;
  else if(nearest.dist<=nearest.width+80) html=`🟠 <b>금지구역 경계 근처입니다.</b><br>가장 가까운 구역: <b>${nearest.id}. ${nearest.name}</b><br>구역선까지 거리: 약 ${Math.round(nearest.dist)}m<br>`;
  else html=`🟢 <b>등록된 금지구역 밖으로 추정됩니다.</b><br>가장 가까운 구역: <b>${nearest.id}. ${nearest.name}</b><br>구역선까지 거리: 약 ${Math.round(nearest.dist)}m<br>`;
  html+=`GPS 정확도: ±${Math.round(acc)}m<br>좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br><small>※ 실사용 보조판정입니다. 현장 안내판·통제선·최신 고시가 최종 우선입니다.</small>`;
  document.getElementById('status').innerHTML=html;
}
function locateMe(){
  const st=document.getElementById('status');
  if(!navigator.geolocation){st.innerHTML='이 브라우저는 GPS를 지원하지 않습니다.';return}
  st.innerHTML='📍 위치 확인 중입니다. 권한 요청이 뜨면 허용을 눌러주세요.';
  navigator.geolocation.getCurrentPosition(updateLocation,e=>{st.innerHTML='<b>위치 확인 실패</b><br>'+e.message+'<br>Safari 설정에서 위치 접근을 허용하세요.'},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

mapEl.addEventListener('pointerdown',e=>{dragging=true;last={x:e.clientX,y:e.clientY};mapEl.setPointerCapture(e.pointerId)});
mapEl.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};panBy(dx,dy)});
mapEl.addEventListener('pointerup',()=>dragging=false);
mapEl.addEventListener('pointercancel',()=>dragging=false);
mapEl.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom+(e.deltaY<0?1:-1))},{passive:false});
window.addEventListener('resize',redraw);
redraw();
</script>
