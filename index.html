<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한강 낚시금지구역 GPS 지도 v3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#0b6f3a;--green2:#11864b;--pink:#e90068;--blue:#1677ff;--bg:#eef1eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:#111}
header{height:56px;background:linear-gradient(90deg,var(--green),var(--green2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 2px 12px #0003;z-index:1000;position:relative}
header h1{font-size:18px;margin:0;white-space:nowrap} header span{font-size:12px;opacity:.9}
#map{height:calc(100vh - 56px);width:100vw}
.btns{position:absolute;right:14px;top:70px;z-index:900;display:flex;flex-direction:column;gap:9px}
.btns button{border:0;border-radius:999px;background:#fff;color:var(--green);font-weight:900;padding:12px 16px;box-shadow:0 4px 16px #0003;font-size:14px}.btns .loc{color:var(--blue)}
.info{position:absolute;left:14px;top:70px;z-index:880;width:min(360px,calc(100vw - 28px));background:rgba(255,255,255,.96);border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 16px #0002;padding:12px 14px;font-size:13px;line-height:1.45}.info b{color:var(--green)}.info .warn{color:#d00;font-weight:900}
.panel{display:none;position:absolute;right:14px;top:178px;z-index:950;width:min(430px,calc(100vw - 28px));max-height:58vh;overflow:auto;background:white;border:1px solid #ddd;border-radius:16px;box-shadow:0 8px 28px #0003;padding:12px;font-size:13px}.panel h3{margin:0 0 8px;color:var(--green)}.close{float:right;border:1px solid #ddd;background:white;color:var(--green);border-radius:8px;width:30px;height:30px;font-weight:900}.item{border:1px solid #eee;border-radius:12px;margin:7px 0;padding:9px 10px;background:#fff;cursor:pointer}.item b{color:var(--pink)}
.status{position:absolute;left:14px;bottom:72px;z-index:900;width:min(430px,calc(100vw - 28px));background:rgba(255,255,255,.97);border:1px solid #ddd;border-radius:16px;box-shadow:0 6px 24px #0003;padding:13px 15px;font-size:14px;line-height:1.55}.judgeForbidden{font-size:22px;font-weight:900;color:var(--pink)}.judgeAllowed{font-size:22px;font-weight:900;color:var(--green)}
.legend{position:absolute;left:14px;bottom:18px;z-index:900;background:rgba(255,255,255,.95);border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 16px #0002;padding:10px 13px;font-size:13px}.sw{display:inline-block;width:30px;height:8px;border-radius:999px;margin-right:6px;vertical-align:1px}.red{background:#e90068}.green{background:#0b6f3a}
.leaflet-popup-content b{color:var(--pink)}
@media(max-width:760px){header h1{font-size:16px}header span{display:none}.info{display:none}.legend{font-size:12px;bottom:12px}.status{bottom:62px;font-size:13px}.btns button{font-size:13px;padding:11px 14px}}
</style>
</head>
<body>
<header><h1>🚫 한강 낚시금지구역 GPS 지도 v3</h1><span>설명문 기반 구간선 방식</span></header>
<div id="map"></div>
<div class="info"><b>v3 기준</b><br>빨간색은 설명문 기준 낚시금지 구간선입니다.<br>녹색은 일반/허가 참고 구간입니다.<br><span class="warn">현장 표지·통제선·최신 고시 우선</span></div>
<div class="btns"><button class="loc" onclick="locateMe()">📍 내 위치</button><button onclick="togglePanel()">☰ 구역목록</button></div>
<div class="panel" id="panel"><button class="close" onclick="togglePanel(false)">×</button><h3>낚시금지구역 24개</h3><div id="list"></div></div>
<div class="status" id="status"><b style="color:#0b6f3a">현재 위치</b><br>내 위치 버튼을 눌러 금지구역 여부를 확인하세요.</div>
<div class="legend"><span class="sw red"></span>금지구역 <span class="sw green"></span>허가/일반구간</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script>
const zones=[{"id": 1, "name": "뚝섬 1지역", "desc": "자양2동 잠실수중보 ~ 청담대교 상류 670m 사이의 한강호안 및 내수면", "judge_m": 84, "coords": [[127.111, 37.545], [127.104, 37.541], [127.096, 37.537], [127.088, 37.533], [127.079, 37.529], [127.0715, 37.525]]}, {"id": 2, "name": "뚝섬 2지역", "desc": "청담대교 북단 상류 450m ~ 성수동 영동대교 북단 하류 710m 사이의 한강호안 및 내수면", "judge_m": 74, "coords": [[127.0715, 37.525], [127.066, 37.5258], [127.06, 37.5266], [127.054, 37.5274], [127.05, 37.5282]]}, {"id": 3, "name": "뚝섬 3지역", "desc": "서울숲 회전 고가시설 ~ 중랑천 합류부 사이의 한강호안 및 내수면", "judge_m": 74, "coords": [[127.05, 37.5282], [127.045, 37.5305], [127.04, 37.534], [127.0352, 37.5383]]}, {"id": 4, "name": "이촌 1지역", "desc": "중랑천 합류부 ~ 동호대교 북단 하류 300m 사이의 한강호안 및 내수면", "judge_m": 74, "coords": [[127.0352, 37.5383], [127.031, 37.5368], [127.0265, 37.535], [127.022, 37.5336], [127.0202, 37.533]]}, {"id": 5, "name": "이촌 2지역", "desc": "동호대교 북단 하류 800m ~ 한남대교 북단 상류 380m 사이의 한강호안 및 내수면(전망로 포함)", "judge_m": 78, "coords": [[127.0202, 37.533], [127.017, 37.5302], [127.014, 37.5268], [127.0108, 37.5228], [127.0137, 37.5187]]}, {"id": 6, "name": "이촌 3지역", "desc": "노들섬 전체, 한강대교 북단 상류 900m ~ 한강대교 북단 교량 사이의 한강호안 및 내수면", "judge_m": 104, "coords": [[126.975, 37.5172], [126.97, 37.5176], [126.965, 37.5174], [126.9597, 37.5167]]}, {"id": 7, "name": "밤섬지역", "desc": "밤섬 전체 및 마포대교 북단 상류 650m ~ 당산철교 북단 상류 500m 사이의 한강호안 및 내수면", "judge_m": 110, "coords": [[126.945, 37.528], [126.939, 37.5265], [126.933, 37.527], [126.927, 37.529], [126.922, 37.5315], [126.9166, 37.5346]]}, {"id": 8, "name": "망원 1지역", "desc": "양화대교 북단 교량 ~ 합정동 양화대교 북단 하류 550m 사이의 한강호안 및 내수면", "judge_m": 74, "coords": [[126.9166, 37.5346], [126.912, 37.537], [126.908, 37.54], [126.904, 37.5428]]}, {"id": 9, "name": "망원 2지역", "desc": "성산대교 북단 상류 600m 교량 ~ 홍제천 합류부 사이의 한강호안 및 내수면", "judge_m": 78, "coords": [[126.904, 37.5428], [126.9, 37.545], [126.896, 37.549], [126.8933, 37.5525]]}, {"id": 10, "name": "망원 3지역", "desc": "당산철교 북단 상류 500m ~ 당산철교 북단 교량 사이의 한강호안 및 내수면", "judge_m": 68, "coords": [[126.9166, 37.5346], [126.9125, 37.5358], [126.909, 37.537], [126.9067, 37.5378]]}, {"id": 11, "name": "난지 1지역", "desc": "홍제천교 ~ 성산대교 북단 하류 1,300m 사이의 한강호안 및 내수면", "judge_m": 84, "coords": [[126.8933, 37.5525], [126.889, 37.5548], [126.884, 37.5572], [126.879, 37.5625]]}, {"id": 12, "name": "난지 2지역", "desc": "가양대교 북단 상류 800m ~ 가양대교 북단 하류 450m 사이의 한강호안 및 내수면", "judge_m": 84, "coords": [[126.868, 37.564], [126.864, 37.566], [126.86, 37.568], [126.856, 37.57], [126.8527, 37.5715]]}, {"id": 13, "name": "난지 3지역", "desc": "월드컵대교 북단 하류 750m ~ 월드컵대교 북단 하류 900m 사이의 한강호안 및 내수면", "judge_m": 60, "coords": [[126.881, 37.5585], [126.88, 37.5595], [126.879, 37.5605]]}, {"id": 14, "name": "잠실지역", "desc": "잠실5동 잠실수중보 ~ 잠실수중보 하류 1,300m 사이의 한강호안 및 내수면", "judge_m": 104, "coords": [[127.111, 37.545], [127.106, 37.542], [127.1, 37.539], [127.0945, 37.5365], [127.0915, 37.5354]]}, {"id": 15, "name": "잠원1지역", "desc": "동호대교 남단 하류 300m ~ 한남대교 남단 하류 1,000m 사이의 한강호안 및 내수면", "judge_m": 78, "coords": [[127.0137, 37.5187], [127.009, 37.517], [127.004, 37.515], [126.999, 37.5134], [126.995, 37.512]]}, {"id": 16, "name": "반포 1지역", "desc": "반포동 반포대교 남단 상류 200m ~ 하류 500m 사이의 한강호안 및 내수면", "judge_m": 74, "coords": [[126.9965, 37.5147], [126.994, 37.5132], [126.9915, 37.5122], [126.9885, 37.5107]]}, {"id": 17, "name": "반포 2지역", "desc": "동작대교 남단 상류 450m ~ 동작대교 남단 하류 280m 사이의 한강호안 및 내수면", "judge_m": 68, "coords": [[126.985, 37.512], [126.982, 37.5114], [126.979, 37.5108], [126.9785, 37.5107]]}, {"id": 18, "name": "흑석지역", "desc": "한강대교 남단 상류 1,360m ~ 본동 한강철교 남단 상류 400m 사이의 한강호안 및 내수면", "judge_m": 78, "coords": [[126.9785, 37.5107], [126.972, 37.5104], [126.966, 37.5097], [126.96, 37.5087], [126.956, 37.5077]]}, {"id": 19, "name": "여의도 1지역", "desc": "원효대교 남단 상류 430m ~ 서강대교 남단 하류 370m 사이의 한강호안 및 내수면", "judge_m": 84, "coords": [[126.935, 37.5263], [126.931, 37.524], [126.928, 37.521], [126.927, 37.5188]]}, {"id": 20, "name": "여의도 2지역", "desc": "여의도동 샛강 내수면 전역", "judge_m": 110, "coords": [[126.927, 37.5188], [126.922, 37.519], [126.917, 37.5197], [126.912, 37.5208], [126.905, 37.523]]}, {"id": 21, "name": "양화 1지역", "desc": "당산철교 남단 상류 370m ~ 당산철교 남단 60m 사이의 한강호안 및 내수면", "judge_m": 68, "coords": [[126.915, 37.5285], [126.912, 37.5298], [126.909, 37.531], [126.9062, 37.5327]]}, {"id": 22, "name": "양화 2지역", "desc": "선유도공원 전체 및 성산대교 남단 상류 600m ~ 안양천 합류부 상류 150m 사이의 한강호안 및 내수면", "judge_m": 97, "coords": [[126.9062, 37.5327], [126.902, 37.536], [126.899, 37.539], [126.8958, 37.542]]}, {"id": 23, "name": "양화3, 강서 1지역", "desc": "염창동 안양천 합류부 하류 150m ~ 마곡철교 남단 하류 400m 사이의 한강호안 및 내수면", "judge_m": 91, "coords": [[126.8958, 37.542], [126.888, 37.545], [126.88, 37.547], [126.87, 37.548], [126.86, 37.551], [126.8515, 37.555]]}, {"id": 24, "name": "강서 2지역", "desc": "방화대교 남단 하류 50m ~ 행주대교 남단 상류 400m 사이의 한강호안 및 내수면", "judge_m": 91, "coords": [[126.84, 37.565], [126.834, 37.5695], [126.828, 37.5735], [126.82, 37.578], [126.81, 37.585]]}];
const map=L.map('map',{zoomControl:true}).setView([37.535,126.975],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const forbiddenLayer=L.featureGroup().addTo(map), allowedLayer=L.featureGroup().addTo(map), userLayer=L.featureGroup().addTo(map);
function toLatLngs(coords){return coords.map(c=>[c[1],c[0]])}
function addBaseAllowed(){
 const river=[[126.8100,37.5850],[126.8400,37.5650],[126.8680,37.5480],[126.8958,37.5420],[126.9166,37.5346],[126.9450,37.5280],[126.9750,37.5172],[126.9950,37.5120],[127.0137,37.5187],[127.0352,37.5383],[127.0500,37.5282],[127.0715,37.5249],[127.0915,37.5354],[127.1110,37.5450],[127.1225,37.5520]];
 L.polyline(toLatLngs(river),{color:'#0b6f3a',weight:8,opacity:.45}).addTo(allowedLayer);
}
function addZones(){
 addBaseAllowed();
 zones.forEach(z=>{
  L.polyline(toLatLngs(z.coords),{color:'#e90068',weight:9,opacity:.72,lineCap:'round',lineJoin:'round'}).bindPopup(`<b>${z.id}. ${z.name}</b><br>${z.desc}`).addTo(forbiddenLayer);
  L.polyline(toLatLngs(z.coords),{color:'#e90068',weight:3,opacity:1,dashArray:'7 5'}).addTo(forbiddenLayer);
  const mid=toLatLngs(z.coords)[Math.floor(z.coords.length/2)];
  L.marker(mid,{icon:L.divIcon({className:'zoneLabel',html:`<div style="background:#e90068;color:white;border-radius:999px;width:26px;height:26px;line-height:26px;text-align:center;font-weight:900;border:2px solid white;box-shadow:0 2px 8px #0003">${z.id}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(forbiddenLayer).on('click',()=>showZone(z));
 });
}
function nearestZone(lat,lng){
 let best=null,bestD=Infinity; const pt=turf.point([lng,lat]);
 zones.forEach(z=>{const snap=turf.nearestPointOnLine(turf.lineString(z.coords),pt,{units:'meters'}); const d=snap.properties.dist||turf.distance(pt,snap,{units:'meters'}); if(d<bestD){bestD=d;best=z}});
 return {zone:best,dist:bestD};
}
function judgeForbidden(lat,lng){const near=nearestZone(lat,lng); const limit=near.zone.judge_m||80; return {forbidden:near.dist<=limit,zone:near.zone,dist:near.dist,limit};}
function renderUser(lat,lng,acc){userLayer.clearLayers();L.circle([lat,lng],{radius:Math.max(acc||0,10),color:'#1677ff',weight:1,fillColor:'#1677ff',fillOpacity:.13}).addTo(userLayer);L.circleMarker([lat,lng],{radius:10,color:'#fff',weight:3,fillColor:'#1677ff',fillOpacity:1}).addTo(userLayer);map.setView([lat,lng],Math.max(map.getZoom(),16));}
function locateMe(){
 const st=document.getElementById('status'); if(!navigator.geolocation){st.innerHTML='<b style="color:#e90068">GPS를 지원하지 않습니다.</b>';return}
 st.innerHTML='📍 위치 확인 중입니다.<br><small>GPS 신호를 3초 동안 보정합니다.</small>';
 const samples=[];let done=false;
 function finish(){
  if(done||!samples.length)return;done=true;samples.sort((a,b)=>a.acc-b.acc);
  const picked=samples.slice(0,Math.min(5,samples.length));let sw=0,slat=0,slng=0;
  picked.forEach(s=>{const w=1/Math.max(8,s.acc);sw+=w;slat+=s.lat*w;slng+=s.lng*w});
  const lat=slat/sw,lng=slng/sw,acc=picked[0].acc;renderUser(lat,lng,acc);
  const j=judgeForbidden(lat,lng),isF=j.forbidden;
  st.innerHTML=`📍 <b style="color:#0b6f3a">현재 위치 표시 완료</b><br><div class="${isF?'judgeForbidden':'judgeAllowed'}">${isF?'금지구역':'허가구역'}</div>가장 가까운 금지구역: <b>${j.zone.id}. ${j.zone.name}</b><br>거리: 약 ${Math.round(j.dist)}m / 판정 기준: ${Math.round(j.limit)}m<br>GPS 정확도: ±${Math.round(acc)}m<br>좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br><small>※ 설명문 기반 v3 구간선 방식입니다. 현장 표지·통제선·최신 고시가 우선입니다.</small>`;
 }
 const id=navigator.geolocation.watchPosition(p=>{const s={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||9999};samples.push(s);st.innerHTML=`📍 위치 확인 중...<br><small>수신 ${samples.length}회 / 현재 정확도 ±${Math.round(s.acc)}m</small>`;if(samples.length>=3&&s.acc<=25){navigator.geolocation.clearWatch(id);finish()}},e=>{if(samples.length)finish();else st.innerHTML='<b style="color:#e90068">위치 확인 실패</b><br>'+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
 setTimeout(()=>{try{navigator.geolocation.clearWatch(id)}catch(e){}finish()},3500);
}
function showZone(z){map.fitBounds(L.latLngBounds(toLatLngs(z.coords)).pad(.8));L.popup().setLatLng(toLatLngs(z.coords)[Math.floor(z.coords.length/2)]).setContent(`<b>${z.id}. ${z.name}</b><br>${z.desc}`).openOn(map)}
function buildList(){const list=document.getElementById('list');zones.forEach(z=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<b>${z.id}. ${z.name}</b><br><small>${z.desc}</small>`;d.onclick=()=>{togglePanel(false);showZone(z)};list.appendChild(d)})}
function togglePanel(force){const p=document.getElementById('panel');p.style.display=force===false?'none':(p.style.display==='block'?'none':'block')}
addZones();buildList();map.fitBounds(forbiddenLayer.getBounds().pad(.08));
</script>
</body>
</html>
