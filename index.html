<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한강 낚시금지구역 v17 간편조정판</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
.panel{position:absolute;left:12px;top:12px;z-index:999;background:white;border-radius:14px;padding:12px;box-shadow:0 4px 18px #0003;font-size:13px;width:min(440px,calc(100vw - 24px));line-height:1.45}
.panel b{color:#0b6f3a}
.toolbox{position:absolute;right:12px;top:12px;z-index:999;background:white;border-radius:14px;padding:12px;box-shadow:0 4px 18px #0003;width:min(390px,calc(100vw - 24px));font-size:13px;max-height:82vh;overflow:auto}
.toolbox h3{margin:0 0 8px;color:#0b6f3a}
select,input{width:100%;padding:9px;border:1px solid #ddd;border-radius:10px;margin:5px 0;box-sizing:border-box}
button{border:0;border-radius:10px;background:#f3f6f4;padding:10px;font-weight:800;color:#0b6f3a}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.small{font-size:12px;color:#555;line-height:1.45}
.legend{position:absolute;left:12px;bottom:12px;z-index:999;background:white;border-radius:12px;padding:10px;box-shadow:0 4px 18px #0003;font-size:13px}
.num{background:#e90068;color:#fff;border-radius:999px;width:28px;height:28px;line-height:28px;text-align:center;font-weight:900;border:2px solid white;box-shadow:0 2px 8px #0005}
.dist{background:#111;color:#fff;border-radius:8px;padding:2px 5px;font-size:11px;white-space:nowrap;border:1px solid #fff;box-shadow:0 1px 5px #0005}
.start{background:#1677ff;color:#fff;border-radius:8px;padding:3px 6px;font-size:12px;border:1px solid #fff;box-shadow:0 1px 5px #0005}
.modeOn{background:#0b6f3a!important;color:white!important}
@media(max-width:760px){
 .panel{display:none}
 .toolbox{right:8px;top:8px;width:min(360px,calc(100vw - 16px));font-size:12px}
 .legend{font-size:12px}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <b>v17 간편조정판</b><br>
  구역 선택 → 꼭짓점 개수 조절 → 전체 이동/회전/확대축소 → 거리표시로 검수.<br>
  교각 기준 첫 지점부터 <b>100m 단위 거리</b>와 총 길이를 표시합니다.
</div>

<div class="toolbox">
  <h3>구역 간편 조정</h3>
  <select id="zoneSelect" onchange="focusSelected()"></select>
  <div class="small" id="info">구역을 선택하세요.</div>

  <label>꼭짓점 개수: <b id="vertexVal">-</b></label>
  <input type="range" min="2" max="80" value="12" id="vertexRange" oninput="previewVertexCount(this.value)" onchange="applyVertexCount(this.value)">
  <div class="grid2">
    <button onclick="changeVertex(-1)">꼭짓점 -1</button>
    <button onclick="changeVertex(1)">꼭짓점 +1</button>
  </div>

  <div class="grid">
    <span></span><button onclick="moveSelected(0,10)">▲ 10m</button><span></span>
    <button onclick="moveSelected(-10,0)">◀ 10m</button><button onclick="resetSelected()">초기화</button><button onclick="moveSelected(10,0)">10m ▶</button>
    <span></span><button onclick="moveSelected(0,-10)">▼ 10m</button><span></span>
  </div>
  <div class="grid">
    <button onclick="moveSelected(-50,0)">서 50m</button>
    <button onclick="moveSelected(0,50)">북 50m</button>
    <button onclick="moveSelected(50,0)">동 50m</button>
  </div>
  <div class="grid2">
    <button onclick="moveSelected(0,-50)">남 50m</button>
    <button onclick="toggleEdit()" id="editBtn">정점 편집</button>
  </div>

  <label>회전: <b id="rotVal">0</b>°</label>
  <input type="range" min="-25" max="25" value="0" id="rotRange" oninput="setRotation(this.value)">
  <label>확대/축소: <b id="scaleVal">100</b>%</label>
  <input type="range" min="80" max="120" value="100" id="scaleRange" oninput="setScale(this.value)">

  <div class="grid2">
    <button onclick="toggleDistance()">거리표시</button>
    <button onclick="toggleLabels()">번호표시</button>
  </div>
  <div class="grid2">
    <button onclick="downloadGeoJSON()">GeoJSON 저장</button>
    <button onclick="downloadHTML()">현재 HTML 저장</button>
  </div>
  <div class="small">
    ※ “정점 편집”을 켜면 지도 위 선/면의 점을 직접 끌 수 있습니다.<br>
    ※ 꼭짓점 개수는 현재 선 모양을 따라 자동 재분배합니다.
  </div>
</div>

<div class="legend">🔴 금지구역 · 🔵 시작점 · 검정표시=첫 지점 기준 거리</div>

5]]]}}, {"type": "Feature", "properties": {"id": 20, "name": "여의도 샛강 전역", "description": "여의도 2지역 특수면", "side": "polygon", "method": "v13_special_area_manual"}, "geometry": {"type": "Polygon", "coordinates": [[[126.9028, 37.519], [126.911, 37.522], [126.919, 37.5202], [126.9295, 37.5173], [126.9305, 37.5145], [126.918, 37.5165], [126.907, 37.517], [126.9028, 37.519]]]}}]};
let state = JSON.parse(localStorage.getItem('hangangV17State') || '{"labels":true,"distance":true,"zones":{}}');

const map = L.map('map').setView([37.535,126.975],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

let geo = JSON.parse(JSON.stringify(baseGeo));
let layer = L.featureGroup().addTo(map);
let labelLayer = L.featureGroup().addTo(map);
let distLayer = L.featureGroup().addTo(map);
let editControl = null;
let editOn = false;

function hav(a,b){
 const R=6371008.8, toRad=Math.PI/180;
 const lat1=a[1]*toRad, lat2=b[1]*toRad, dlat=(b[1]-a[1])*toRad, dlng=(b[0]-a[0])*toRad;
 const h=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlng/2)**2;
 return 2*R*Math.asin(Math.sqrt(h));
}
function metersToLngLat(dx,dy,lat){return [dx/(111320*Math.cos(lat*Math.PI/180)), dy/111320];}
function centerOf(coords){
 let sx=0, sy=0, n=0; coords.forEach(c=>{sx+=c[0]; sy+=c[1]; n++;});
 return [sx/n, sy/n];
}
function rotateScale(c, ctr, deg, scale){
 const lat=ctr[1], mx=111320*Math.cos(lat*Math.PI/180), my=111320;
 let x=(c[0]-ctr[0])*mx, y=(c[1]-ctr[1])*my;
 const r=deg*Math.PI/180, s=scale/100;
 let nx=(x*Math.cos(r)-y*Math.sin(r))*s;
 let ny=(x*Math.sin(r)+y*Math.cos(r))*s;
 return [ctr[0]+nx/mx, ctr[1]+ny/my];
}
function shift(c, dx, dy){const d=metersToLngLat(dx,dy,c[1]); return [c[0]+d[0], c[1]+d[1]];}
function zoneState(id){if(!state.zones[id]) state.zones[id]={dx:0,dy:0,rot:0,scale:100}; return state.zones[id];}
function getFeatureCoords(f){
 if(f.geometry.type==='LineString') return f.geometry.coordinates;
 if(f.geometry.type==='Polygon') return f.geometry.coordinates[0].slice(0,-1);
 return [];
}
function setFeatureCoords(f, coords){
 if(f.geometry.type==='LineString') f.geometry.coordinates = coords;
 if(f.geometry.type==='Polygon') f.geometry.coordinates = [coords.concat([coords[0]])];
}
function transformFeature(f){
 const id=String(f.properties.id), st=zoneState(id);
 let coords = getFeatureCoords(f);
 let ctr = centerOf(coords);
 let newCoords = coords.map(c=>rotateScale(c,ctr,st.rot||0,st.scale||100)).map(c=>shift(c,st.dx||0,st.dy||0));
 let nf=JSON.parse(JSON.stringify(f));
 setFeatureCoords(nf,newCoords);
 nf.properties.cal_dx_m=st.dx||0; nf.properties.cal_dy_m=st.dy||0; nf.properties.rotation_deg=st.rot||0; nf.properties.scale_pct=st.scale||100;
 return nf;
}
function transformedGeo(){
 return {type:'FeatureCollection', name:'hangang_fishing_v17_adjusted', features: geo.features.map(transformFeature)};
}
function style(f){
 return f.geometry.type==='Polygon'
  ? {color:'#e90068',weight:2,fillColor:'#e90068',fillOpacity:.42}
  : {color:'#e90068',weight:7,opacity:.75,lineCap:'round',lineJoin:'round'};
}
function render(){
 layer.clearLayers(); labelLayer.clearLayers(); distLayer.clearLayers();
 const tg=transformedGeo();
 L.geoJSON(tg,{style:style,onEachFeature:(f,l)=>{l.bindPopup(`<b>${f.properties.id}. ${f.properties.name}</b><br>${f.properties.description || ''}`);l.addTo(layer);}});
 if(state.labels) drawLabels(tg);
 if(state.distance) drawDistances(tg);
 updateInfo();
 localStorage.setItem('hangangV17State',JSON.stringify(state));
}
function drawLabels(tg){
 tg.features.forEach(f=>{
  const cs=getFeatureCoords(f); if(!cs.length) return;
  const mid=cs[Math.floor(cs.length/2)];
  L.marker([mid[1],mid[0]],{icon:L.divIcon({className:'',html:`<div class="num">${f.properties.id}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}).addTo(labelLayer);
 });
}
function lengthOf(cs){let s=0; for(let i=1;i<cs.length;i++) s+=hav(cs[i-1],cs[i]); return s;}
function pointAt(cs, m){
 let acc=0;
 for(let i=1;i<cs.length;i++){
  let seg=hav(cs[i-1],cs[i]);
  if(acc+seg>=m){
    let t=(m-acc)/seg, a=cs[i-1], b=cs[i];
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  }
  acc+=seg;
 }
 return cs[cs.length-1];
}
function drawDistances(tg){
 const id=selectedId();
 tg.features.filter(f=>String(f.properties.id)===id).forEach(f=>{
  const cs=getFeatureCoords(f); if(cs.length<2) return;
  L.marker([cs[0][1],cs[0][0]],{icon:L.divIcon({className:'',html:`<div class="start">시작</div>`,iconSize:[38,20],iconAnchor:[19,10]})}).addTo(distLayer);
  const total=lengthOf(cs);
  for(let m=100;m<total;m+=100){
    const p=pointAt(cs,m);
    L.marker([p[1],p[0]],{icon:L.divIcon({className:'',html:`<div class="dist">${Math.round(m)}m</div>`,iconSize:[44,18],iconAnchor:[22,9]})}).addTo(distLayer);
  }
  const end=cs[cs.length-1];
  L.marker([end[1],end[0]],{icon:L.divIcon({className:'',html:`<div class="dist">총 ${Math.round(total)}m</div>`,iconSize:[70,18],iconAnchor:[35,9]})}).addTo(distLayer);
 });
}
function selectedId(){return document.getElementById('zoneSelect').value || '1';}
function selectedFeatures(){return geo.features.filter(f=>String(f.properties.id)===selectedId());}
function focusSelected(){
 render();
 const fs=transformedGeo().features.filter(f=>String(f.properties.id)===selectedId());
 if(fs.length){try{map.fitBounds(L.geoJSON({type:'FeatureCollection',features:fs}).getBounds().pad(1));}catch(e){}}
}
function updateInfo(){
 const id=selectedId(), fs=selectedFeatures();
 const line=fs.find(f=>f.geometry.type==='LineString') || fs[0];
 if(!line) return;
 const cs=getFeatureCoords(line);
 const st=zoneState(id);
 document.getElementById('vertexVal').textContent=cs.length;
 document.getElementById('vertexRange').value=Math.min(80,Math.max(2,cs.length));
 document.getElementById('rotVal').textContent=st.rot||0;
 document.getElementById('rotRange').value=st.rot||0;
 document.getElementById('scaleVal').textContent=st.scale||100;
 document.getElementById('scaleRange').value=st.scale||100;
 document.getElementById('info').innerHTML=`선택: <b>${id}</b> / 꼭짓점 ${cs.length}개 / 길이 약 ${Math.round(lengthOf(getFeatureCoords(transformFeature(line))))}m`;
}
function resample(cs,n){
 if(cs.length<2 || n<2) return cs;
 const total=lengthOf(cs), out=[];
 for(let i=0;i<n;i++) out.push(pointAt(cs,total*i/(n-1)));
 return out;
}
function previewVertexCount(v){document.getElementById('vertexVal').textContent=v;}
function applyVertexCount(v){
 const n=Number(v), id=selectedId();
 geo.features.filter(f=>String(f.properties.id)===id).forEach(f=>{
   const cs=getFeatureCoords(f);
   if(cs.length>=2) setFeatureCoords(f,resample(cs,n));
 });
 render();
}
function changeVertex(d){
 const current=Number(document.getElementById('vertexRange').value);
 const next=Math.min(80,Math.max(2,current+d));
 document.getElementById('vertexRange').value=next; applyVertexCount(next);
}
function moveSelected(dx,dy){const st=zoneState(selectedId()); st.dx=(st.dx||0)+dx; st.dy=(st.dy||0)+dy; render();}
function setRotation(v){zoneState(selectedId()).rot=Number(v); render();}
function setScale(v){zoneState(selectedId()).scale=Number(v); render();}
function toggleDistance(){state.distance=!state.distance; render();}
function toggleLabels(){state.labels=!state.labels; render();}
function downloadGeoJSON(){
 const blob=new Blob([JSON.stringify(transformedGeo(),null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob); const a=document.createElement('a');
 a.href=url; a.download='hangang_fishing_v17_adjusted.geojson'; a.click(); URL.revokeObjectURL(url);
}
function downloadHTML(){ alert('현재는 GeoJSON 저장 후 최종 HTML에 반영하는 방식입니다.'); }
function toggleEdit(){
 alert('정점 직접 편집은 v16 파일을 사용하세요. v17은 꼭짓점 개수/거리/이동/회전/확대축소 간편조정용입니다.');
}

const select=document.getElementById('zoneSelect');
const ids=[...new Set(geo.features.map(f=>String(f.properties.id)))].sort((a,b)=>Number(a)-Number(b));
ids.forEach(id=>{
 const f=geo.features.find(x=>String(x.properties.id)===id);
 const o=document.createElement('option'); o.value=id; o.textContent=`${id}. ${f.properties.name}`; select.appendChild(o);
});
render();
try{map.fitBounds(layer.getBounds().pad(.08))}catch(e){}
</script>
