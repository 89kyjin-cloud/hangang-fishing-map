<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한강 낚시금지구역 GPS 확인</title>
<style>
:root{--green:#0b6f3a;--green2:#11864b;--red:#e90068;--blue:#1677ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:#eef1eb}
header{height:54px;background:linear-gradient(90deg,var(--green),var(--green2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 2px 10px #0002;z-index:1000;position:relative}
h1{font-size:17px;margin:0} header span{font-size:12px;opacity:.9}
#map{position:relative;width:100vw;height:calc(100vh - 54px);overflow:hidden;touch-action:none;background:#e8efe6}
.tile{position:absolute;width:256px;height:256px;background:#f4f4f4;user-select:none;-webkit-user-drag:none}
#tiles,#overlay{position:absolute;inset:0}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.locBtn{position:absolute;right:12px;top:66px;z-index:1000;border:0;border-radius:999px;background:#fff;color:var(--green);font-weight:900;padding:11px 15px;box-shadow:0 4px 16px #0003;font-size:14px}
.listBtn{position:absolute;right:12px;top:116px;z-index:1000;border:0;border-radius:999px;background:#fff;color:var(--green);font-weight:900;padding:10px 14px;box-shadow:0 4px 16px #0003;font-size:13px}
.legend{position:absolute;left:12px;top:66px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid #d9e5d9;border-radius:14px;box-shadow:0 4px 16px #0002;padding:10px 12px;font-size:12px;line-height:1.4;max-width:270px}
.legend b{color:var(--green)}
.status{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1000;background:rgba(255,255,255,.97);border:1px solid #d9e5d9;border-radius:16px;box-shadow:0 6px 24px #0003;padding:12px 14px;font-size:13px;line-height:1.45;max-height:40vh;overflow:auto}
.status b{color:var(--green)}
.userDot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--blue);border:3px solid #fff;border-radius:999px;box-shadow:0 0 0 7px rgba(22,119,255,.20),0 3px 12px #0005;z-index:20}
.accCircle{position:absolute;border:1px solid var(--blue);background:rgba(22,119,255,.08);border-radius:50%;z-index:19;pointer-events:none}
.zonePin{position:absolute;transform:translate(-50%,-50%);background:var(--red);color:white;border:2px solid white;border-radius:999px;width:28px;height:28px;text-align:center;line-height:24px;font-weight:900;box-shadow:0 2px 8px #0005;z-index:8;font-size:13px;cursor:pointer}
.zonePin.near{width:38px;height:38px;line-height:34px;font-size:16px;box-shadow:0 0 0 8px rgba(233,0,104,.18),0 4px 14px #0005}
.popup,.zonePanel{position:absolute;display:none;right:12px;top:166px;z-index:1002;width:min(390px,calc(100vw - 24px));max-height:56vh;overflow:auto;background:white;border:1px solid #ddd;border-radius:16px;box-shadow:0 8px 28px #0003;padding:14px;line-height:1.45;font-size:14px}
.popup b,.zonePanel b{color:var(--red)}
.close{position:sticky;float:right;top:0;border:1px solid #ddd;background:#fff;color:var(--green);border-radius:8px;width:30px;height:30px;font-weight:900}
.zoneItem{border:1px solid #eee;border-radius:12px;margin:7px 0;padding:9px 10px;background:#fff;cursor:pointer}
.zoomCtl{position:absolute;right:12px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:1000;display:flex;flex-direction:column;gap:6px}
.zoomCtl button{width:44px;height:44px;border:0;border-radius:12px;background:white;color:var(--green);font-size:24px;font-weight:900;box-shadow:0 3px 12px #0003}
@media(max-width:700px){header span{display:none}h1{font-size:16px}.legend{font-size:11px;max-width:225px}.status{font-size:12px}.locBtn{font-size:13px;padding:10px 13px}.listBtn{top:112px}.popup,.zonePanel{top:156px;max-height:50vh}}
</style>
</head>
<body>
<header><h1>🚫 한강 낚시금지구역 GPS 확인</h1><span>공식 구역명 기반 · GPS 보조판정</span></header>
<div id="map">
  <div id="tiles"></div>
  <div id="overlay"><svg id="svg"></svg></div>
</div>
<button class="locBtn" onclick="locateMe()">📍 내 위치</button>
<button class="listBtn" onclick="togglePanel()">📋 구역목록</button>
<div class="zoomCtl"><button onclick="setZoom(zoom+1)">＋</button><button onclick="setZoom(zoom-1)">－</button></div>
<div class="legend"><b>사용 방법</b><br>내 위치를 누르면 가까운 공식 금지구역을 기준으로 판정합니다.<br>번호는 공식 24개 구역 확인용입니다.</div>
<div id="popup" class="popup"><button class="close" onclick="closePopup()">×</button><div id="popupText"></div></div>
<div id="zonePanel" class="zonePanel"><button class="close" onclick="togglePanel(false)">×</button><h3 style="margin:0 0 8px;color:var(--green)">공식 낚시금지구역 24개</h3><div id="zoneList"></div></div>
<div id="status" class="status">📍 <b>내 위치</b> 버튼을 눌러 현재 위치를 확인하세요.<br><small>※ 현장 안내판·통제선·최신 고시가 최종 우선입니다.</small></div>
<script>
const zones=[{"id": 1, "name": "뚝섬 1지역", "desc": "자양2동 잠실수중보 ~ 청담대교 상류 670m 사이의 한강호안 및 내수면", "lat": 37.5249, "lng": 127.0715, "r": 1500}, {"id": 2, "name": "뚝섬 2지역", "desc": "청담대교 북단 상류 450m ~ 성수동 영동대교 북단 하류 710m 사이의 한강호안 및 내수면", "lat": 37.5282, "lng": 127.05, "r": 1100}, {"id": 3, "name": "뚝섬 3지역", "desc": "서울숲 회전 고가시설 ~ 중랑천 합류부 사이의 한강호안 및 내수면", "lat": 37.5383, "lng": 127.0352, "r": 900}, {"id": 4, "name": "이촌 1지역", "desc": "중랑천 합류부 ~ 동호대교 북단 하류 300m 사이의 한강호안 및 내수면", "lat": 37.533, "lng": 127.0202, "r": 750}, {"id": 5, "name": "이촌 2지역", "desc": "동호대교 북단 하류 800m ~ 한남대교 북단 상류 380m 사이의 한강호안 및 내수면(전망로 포함)", "lat": 37.5272, "lng": 127.006, "r": 800}, {"id": 6, "name": "이촌 3지역", "desc": "노들섬 전체, 한강대교 북단 상류 900m(거북선 선착장) ~ 한강대교 북단 교량 사이의 한강호안 및 내수면", "lat": 37.5167, "lng": 126.9597, "r": 900}, {"id": 7, "name": "밤섬지역", "desc": "밤섬 전체 및 마포대교 북단 상류 650m ~ 당산철교 북단 상류 500m 사이의 한강호안 및 내수면", "lat": 37.5346, "lng": 126.9166, "r": 1050}, {"id": 8, "name": "망원 1지역", "desc": "양화대교 북단 교량 ~ 합정동 양화대교 북단 하류 550m 사이의 한강호안 및 내수면", "lat": 37.5428, "lng": 126.904, "r": 600}, {"id": 9, "name": "망원 2지역", "desc": "성산대교 북단 상류 600m 교량 ~ 홍제천 합류부 사이의 한강호안 및 내수면", "lat": 37.5525, "lng": 126.8933, "r": 800}, {"id": 10, "name": "망원 3지역", "desc": "당산철교 북단 상류 500m ~ 당산철교 북단 교량 사이의 한강호안 및 내수면", "lat": 37.5378, "lng": 126.9067, "r": 450}, {"id": 11, "name": "난지 1지역", "desc": "홍제천교 ~ 성산대교 북단 하류 1,300m(조정면허시험장 하류 50m) 사이의 한강호안 및 내수면", "lat": 37.5625, "lng": 126.879, "r": 950}, {"id": 12, "name": "난지 2지역", "desc": "가양대교 북단 상류 800m(난지캠핑장 끝 호안 하류 측) ~ 가양대교 북단 하류 450m 사이의 한강호안 및 내수면(생태습지원 엄격한 내수면 포함)", "lat": 37.5715, "lng": 126.8527, "r": 1000}, {"id": 13, "name": "난지 3지역", "desc": "월드컵대교 북단 하류 750m ~ 월드컵대교 북단 하류 900m 사이의 한강호안 및 내수면", "lat": 37.5585, "lng": 126.881, "r": 350}, {"id": 14, "name": "잠실지역", "desc": "잠실5동 잠실수중보 ~ 잠실수중보 하류 1,300m 사이의 한강호안 및 내수면", "lat": 37.545, "lng": 127.111, "r": 1700}, {"id": 15, "name": "잠원1지역", "desc": "동호대교 남단 하류 300m(리버시티) ~ 한남대교 남단 하류 1,000m(요트클럽 하류 100m) 사이의 한강호안 및 내수면", "lat": 37.5187, "lng": 127.0137, "r": 850}, {"id": 16, "name": "반포 1지역", "desc": "반포동 반포대교 남단 상류 200m(전망데크) ~ 하류 500m(임시선착장) 사이의 한강호안 및 내수면", "lat": 37.512, "lng": 126.995, "r": 600}, {"id": 17, "name": "반포 2지역", "desc": "동작대교 남단 상류 450m(서래섬 하류 100m) ~ 동작대교 남단 하류 280m 사이의 한강호안 및 내수면", "lat": 37.5107, "lng": 126.9785, "r": 650}, {"id": 18, "name": "흑석지역", "desc": "한강대교 남단 상류 1,360m(한강현대아파트 114동 앞) ~ 본동 한강철교 남단 상류 400m 사이의 한강호안 및 내수면", "lat": 37.5077, "lng": 126.956, "r": 850}, {"id": 19, "name": "여의도 1지역", "desc": "원효대교 남단 상류 430m ~ 서강대교 남단 하류 370m 사이의 한강호안 및 내수면", "lat": 37.5263, "lng": 126.935, "r": 850}, {"id": 20, "name": "여의도 2지역", "desc": "여의도동 샛강 내수면 전역(상·하류 합류부 및 연결한 내수면 포함)", "lat": 37.5188, "lng": 126.927, "r": 900}, {"id": 21, "name": "양화 1지역", "desc": "당산철교 남단 상류 370m(여의도 샛강 하류 합류부) ~ 당산철교 남단 60m(해양소년단 수상훈련장)의 한강호안 및 내수면", "lat": 37.5327, "lng": 126.9062, "r": 500}, {"id": 22, "name": "양화 2지역", "desc": "선유도공원 전체 및 성산대교 남단 상류 600m ~ 안양천 합류부 상류 150m 사이의 한강호안 및 내수면", "lat": 37.542, "lng": 126.8958, "r": 1000}, {"id": 23, "name": "양화3, 강서 1지역", "desc": "염창동 안양천 합류부 하류 150m ~ 마곡철교 남단 하류 400m 사이의 한강호안 및 내수면", "lat": 37.555, "lng": 126.8515, "r": 1200}, {"id": 24, "name": "강서 2지역", "desc": "방화대교 남단 하류 50m ~ 행주대교 남단 상류 400m 사이의 한강호안 및 내수면", "lat": 37.585, "lng": 126.81, "r": 1200}];
const mapEl=document.getElementById('map'), tilesEl=document.getElementById('tiles'), svg=document.getElementById('svg');
let zoom=13, center={lat:37.535,lng:126.98}, dragging=false,last=null,userMarker=null,accEl=null,activeId=null;
let tileHost=0;
const HOSTS=['https://tile.openstreetmap.org/{z}/{x}/{y}.png','https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png'];

function project(lat,lng,z=zoom){const sin=Math.sin(lat*Math.PI/180),n=256*Math.pow(2,z);return {x:(lng+180)/360*n,y:(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*n}}
function unproject(x,y,z=zoom){const n=256*Math.pow(2,z),lng=x/n*360-180,lat=(180/Math.PI)*(2*Math.atan(Math.exp((0.5-y/n)*2*Math.PI))-Math.PI/2);return {lat,lng}}
function centerPx(){return project(center.lat,center.lng)}
function sp(lat,lng){const p=project(lat,lng),c=centerPx();return {x:mapEl.clientWidth/2+p.x-c.x,y:mapEl.clientHeight/2+p.y-c.y}}
function mpp(lat=center.lat){return 156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,zoom)}
function redraw(){drawTiles();drawZones();drawUser()}
function drawTiles(){const c=centerPx(),w=mapEl.clientWidth,h=mapEl.clientHeight,max=Math.pow(2,zoom);let html='',tpl=HOSTS[tileHost%HOSTS.length];const sx=Math.floor((c.x-w/2)/256)-1,ex=Math.floor((c.x+w/2)/256)+1,sy=Math.floor((c.y-h/2)/256)-1,ey=Math.floor((c.y+h/2)/256)+1;for(let x=sx;x<=ex;x++)for(let y=sy;y<=ey;y++){if(y<0||y>=max)continue;const tx=((x%max)+max)%max,left=x*256-c.x+w/2,top=y*256-c.y+h/2,src=tpl.replace('{z}',zoom).replace('{x}',tx).replace('{y}',y);html+=`<img class="tile" src="${src}" style="left:${left}px;top:${top}px" onerror="this.style.display='none'">`;}tilesEl.innerHTML=html}
function drawZones(){document.querySelectorAll('.zonePin').forEach(e=>e.remove());svg.innerHTML='';zones.forEach(z=>{const p=sp(z.lat,z.lng);const pin=document.createElement('div');pin.className='zonePin'+(activeId===z.id?' near':'');pin.textContent=z.id;pin.style.left=p.x+'px';pin.style.top=p.y+'px';pin.onclick=()=>showZone(z);mapEl.appendChild(pin);})}
function setZoom(z){zoom=Math.max(10,Math.min(18,z));redraw()}
function panBy(dx,dy){const c=centerPx();center=unproject(c.x-dx,c.y-dy);redraw()}
function hav(a,b,c,d){const R=6371000,toRad=Math.PI/180,p1=a*toRad,p2=c*toRad,dp=(c-a)*toRad,dl=(d-b)*toRad,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function judge(lat,lng){return zones.map(z=>{const dist=hav(lat,lng,z.lat,z.lng);return {...z,dist,inside:dist<=z.r}}).sort((a,b)=>a.dist-b.dist)}
function showZone(z){activeId=z.id;center={lat:z.lat,lng:z.lng};zoom=Math.max(zoom,15);redraw();document.getElementById('popupText').innerHTML=`<b>${z.id}. ${z.name}</b><br>${z.desc}<br><small>※ 공식 자료 구역명 기반 보조 표시입니다.</small>`;document.getElementById('popup').style.display='block'}
function closePopup(){document.getElementById('popup').style.display='none'}
function renderList(){const l=document.getElementById('zoneList');l.innerHTML='';zones.forEach(z=>{const d=document.createElement('div');d.className='zoneItem';d.innerHTML=`<b>${z.id}. ${z.name}</b><br><small>${z.desc}</small>`;d.onclick=()=>{togglePanel(false);showZone(z)};l.appendChild(d)})}
function togglePanel(force){const p=document.getElementById('zonePanel');p.style.display=force===false?'none':(p.style.display==='block'?'none':'block')}
function drawUser(){if(!userMarker)return;const p=sp(userMarker.lat,userMarker.lng);userMarker.el.style.left=p.x+'px';userMarker.el.style.top=p.y+'px';const r=Math.max(10,userMarker.acc/mpp(userMarker.lat));accEl.style.left=(p.x-r)+'px';accEl.style.top=(p.y-r)+'px';accEl.style.width=(r*2)+'px';accEl.style.height=(r*2)+'px'}
function updateLocation(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy||0;center={lat,lng};zoom=Math.max(zoom,16);if(!userMarker){const el=document.createElement('div');el.className='userDot';mapEl.appendChild(el);accEl=document.createElement('div');accEl.className='accCircle';mapEl.appendChild(accEl);userMarker={el,lat,lng,acc}}else{userMarker.lat=lat;userMarker.lng=lng;userMarker.acc=acc}const j=judge(lat,lng),near=j[0];activeId=near.id;redraw();let html='';if(near.inside)html=`🔴 <b>낚시금지구역 안으로 추정됩니다.</b><br>가장 가까운 공식 구역: <b>${near.id}. ${near.name}</b><br>구역 중심까지 거리: 약 ${Math.round(near.dist)}m<br>`;else if(near.dist<=near.r+150)html=`🟠 <b>금지구역 경계 근처입니다.</b><br>가장 가까운 공식 구역: <b>${near.id}. ${near.name}</b><br>거리: 약 ${Math.round(near.dist)}m<br>`;else html=`🟢 <b>등록된 금지구역 밖으로 추정됩니다.</b><br>가장 가까운 공식 구역: <b>${near.id}. ${near.name}</b><br>거리: 약 ${Math.round(near.dist)}m<br>`;html+=`GPS 정확도: ±${Math.round(acc)}m<br>좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br><small>※ 보조판정입니다. 현장 표지·통제선·최신 고시가 최종 우선입니다.</small>`;document.getElementById('status').innerHTML=html}
function locateMe(){const st=document.getElementById('status');if(!navigator.geolocation){st.innerHTML='GPS를 지원하지 않습니다.';return}st.innerHTML='📍 위치 확인 중입니다. 권한 요청이 뜨면 허용을 눌러주세요.';navigator.geolocation.getCurrentPosition(updateLocation,e=>{st.innerHTML='<b>위치 확인 실패</b><br>'+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
mapEl.addEventListener('pointerdown',e=>{dragging=true;last={x:e.clientX,y:e.clientY};mapEl.setPointerCapture(e.pointerId)});mapEl.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};panBy(dx,dy)});mapEl.addEventListener('pointerup',()=>dragging=false);mapEl.addEventListener('pointercancel',()=>dragging=false);mapEl.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom+(e.deltaY<0?1:-1))},{passive:false});window.addEventListener('resize',redraw);
renderList();redraw();setTimeout(()=>{tileHost=1;drawTiles()},2500);
</script>
</body>
</html>
