let cal = JSON.parse(localStorage.getItem('hangangCalV14') || '{"dx":0,"dy":0,"width":7,"labels":true}');

const map=L.map('map').setView([37.535,126.975],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

let layer=L.featureGroup().addTo(map);
let labelLayer=L.featureGroup().addTo(map);

function metersToLngLat(dx, dy, lat){
  const dLat = dy / 111320;
  const dLng = dx / (111320 * Math.cos(lat * Math.PI / 180));
  return [dLng, dLat];
}

function transformCoord(c){
  const delta = metersToLngLat(cal.dx, cal.dy, c[1]);
  return [c[0] + delta[0], c[1] + delta[1]];
}

function transformGeometry(g){
  if(g.type === 'LineString') return {type:'LineString', coordinates:g.coordinates.map(transformCoord)};
  if(g.type === 'Polygon') return {type:'Polygon', coordinates:g.coordinates.map(r=>r.map(transformCoord))};
  return g;
}

function calibratedGeo(){
  return {
    type:'FeatureCollection',
    name:'hangang_fishing_forbidden_zones_v14_calibrated',
    features: originalGeo.features.map(f=>({
      type:'Feature',
      properties: Object.assign({}, f.properties, {cal_dx_m:cal.dx, cal_dy_m:cal.dy}),
      geometry: transformGeometry(f.geometry)
    }))
  };
}

function style(f){
  return f.geometry.type==='Polygon'
    ? {color:'#e90068',weight:2,fillColor:'#e90068',fillOpacity:.42}
    : {color:'#e90068',weight:Number(cal.width),opacity:.75,lineCap:'round',lineJoin:'round'};
}

function render(){
  layer.clearLayers();
  labelLayer.clearLayers();
  const geo = calibratedGeo();
  L.geoJSON(geo,{
    style: style,
    onEachFeature:(f,l)=>{
      l.bindPopup(`<b>${f.properties.id}. ${f.properties.name}</b><br>${f.properties.description}<br><small>${f.properties.side || ''}</small>`);
      l.addTo(layer);
    }
  });
  if(cal.labels){
    geo.features.forEach(f=>{
      let coords=f.geometry.type==='Polygon'?f.geometry.coordinates[0]:f.geometry.coordinates;
      let mid=coords[Math.floor(coords.length/2)];
      L.marker([mid[1],mid[0]],{icon:L.divIcon({className:'',html:`<div class="num">${f.properties.id}</div>`,iconSize:[28,28],iconAnchor:[14,14]})})
        .addTo(labelLayer)
        .bindPopup(`<b>${f.properties.id}. ${f.properties.name}</b><br>${f.properties.description}`);
    });
  }
  document.getElementById('dx').textContent = Math.round(cal.dx);
  document.getElementById('dy').textContent = Math.round(cal.dy);
  document.getElementById('wval').textContent = cal.width;
  document.getElementById('widthRange').value = cal.width;
  localStorage.setItem('hangangCalV14', JSON.stringify(cal));
}

function move(dx,dy){ cal.dx += dx; cal.dy += dy; render(); }
function resetCal(){ cal={dx:0,dy:0,width:7,labels:true}; render(); }
function setWidth(v){ cal.width=Number(v); render(); }
function toggleLabels(){ cal.labels=!cal.labels; render(); }
function toggleCal(){const e=document.getElementById('cal'); e.style.display=e.style.display==='block'?'none':'block';}
function toggleList(force){const e=document.getElementById('list'); e.style.display=force===false?'none':(e.style.display==='block'?'none':'block');}

function downloadCalibrated(){
  const blob = new Blob([JSON.stringify(calibratedGeo(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hangang_fishing_forbidden_zones_v14_calibrated.geojson';
  a.click();
  URL.revokeObjectURL(url);
}

const list=document.getElementById('list');
originalGeo.features.filter(f=>f.geometry.type==='LineString').forEach(f=>{
  const d=document.createElement('div');
  d.className='item';
  d.innerHTML=`<b>${f.properties.id}. ${f.properties.name}</b><br><small>${f.properties.description}</small>`;
  d.onclick=()=>{
    const single={type:'FeatureCollection',features:[Object.assign({},f,{geometry:transformGeometry(f.geometry)})]};
    map.fitBounds(L.geoJSON(single).getBounds().pad(1));
    toggleList(false);
  };
  list.appendChild(d);
});

render();
try{map.fitBounds(layer.getBounds().pad(.08))}catch(e){}
</script>
