const forbid=L.featureGroup().addTo(map);
function style(f){
  const exact = (f.properties.geometry_mode||'').includes('exact_osm');
  return {color:exact?'#ff4d00':'#e90068', weight:2, fillColor:exact?'#ff4d00':'#e90068', fillOpacity:exact?.48:.38};
}
L.geoJSON(forbidden,{style:style,onEachFeature:(f,l)=>{l.bindPopup(`<b>${f.properties.id}. ${f.properties.name}</b><br>${f.properties.description||''}<br><small>${f.properties.geometry_mode||''}</small>`);l.addTo(forbid);}});
forbidden.features.forEach(f=>{let c=f.geometry.type==='Polygon'?f.geometry.coordinates[0]:(f.geometry.type==='MultiPolygon'?f.geometry.coordinates[0][0]:null);if(!c)return;let p=c[Math.floor(c.length/2)];L.marker([p[1],p[0]],{icon:L.divIcon({className:'',html:`<div class="num">${f.properties.id}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map);});
const list=document.getElementById('list');
forbidden.features.sort((a,b)=>(a.properties.id||0)-(b.properties.id||0)).forEach(f=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<b>${f.properties.id}. ${f.properties.name}</b><br><small>${f.properties.description||''}</small>`;d.onclick=()=>{try{map.fitBounds(L.geoJSON(f).getBounds().pad(1));}catch(e){}toggleList(false)};list.appendChild(d);});
function toggleList(force){const e=document.getElementById('list');e.style.display=force===false?'none':(e.style.display==='block'?'none':'block')}
try{map.fitBounds(forbid.getBounds().pad(.08))}catch(e){}
</script></body></html>
