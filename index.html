<!doctype html>
<html lang="ko">
<head>

<title>한강 낚시금지구역 실사용 GPS 지도</title>

<style>
:root{--green:#0b6f3a;--green2:#11864b;--red:#e90068;--blue:#1677ff;--warn:#ff8a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;overflow:hidden;background:#f5f7f4}
header{height:54px;background:linear-gradient(90deg,var(--green),var(--green2));color:white;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 2px 10px #0002;z-index:1000;position:relative}
h1{font-size:17px;margin:0} header span{font-size:12px;opacity:.9}
#map{width:100vw;height:calc(100vh - 54px)}
.locBtn{position:absolute;right:12px;top:66px;z-index:1000;border:0;border-radius:999px;background:white;color:var(--green);font-weight:900;padding:11px 15px;box-shadow:0 4px 16px #0003;font-size:14px}
.status{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1000;background:rgba(255,255,255,.97);border:1px solid #d9e5d9;border-radius:16px;box-shadow:0 6px 24px #0003;padding:12px 14px;font-size:13px;line-height:1.45;max-height:40vh;overflow:auto}
.status b{color:var(--green)}
.legend{position:absolute;left:12px;top:66px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid #d9e5d9;border-radius:14px;box-shadow:0 4px 16px #0002;padding:10px 12px;font-size:12px;line-height:1.4;max-width:275px}
.legend b{color:var(--green)}
.userDot{background:var(--blue);border:3px solid white;border-radius:999px;width:16px;height:16px;box-shadow:0 0 0 7px rgba(22,119,255,.20),0 3px 12px #0005}
.zoneLabel{background:var(--red);color:#fff;border:2px solid #fff;border-radius:999px;width:28px;height:28px;text-align:center;line-height:24px;font-weight:900;box-shadow:0 2px 8px #0005}
.leaflet-popup-content{font-size:14px;line-height:1.45}
@media(max-width:700px){
 header span{display:none}
 h1{font-size:16px}
 .legend{font-size:11px;max-width:225px}
 .status{font-size:12px}
 .locBtn{font-size:13px;padding:10px 13px}
}

</head>
<body>
<header><h1>🚫 한강 낚시금지구역 실사용 GPS 지도</h1><span>실제 좌표 기반 · 선형 구역 판정</span></header>
<div id="map"></div>

<div class="legend"><b>사용 방법</b><br>분홍색 선/구역을 누르면 설명이 표시됩니다.<br>내 위치를 누르면 현재 위치 기준으로 금지구역 여부를 계산합니다.</div>
<div id="status" class="status">📍 <b>내 위치</b> 버튼을 눌러 현재 위치를 확인하세요.<br><small>※ 현장 안내판·통제선·최신 공고가 우선입니다.</small></div>

<script>
const zones = [{"id": 1, "name": "뚝섬 1지역", "desc": "자양2동 잠실수중보 ~ 청담대교 상류 670m 사이의 한강호안 및 내수면", "width": 230, "path": [[37.5205, 127.0955], [37.522, 127.087], [37.5235, 127.079], [37.5248, 127.0715], [37.5258, 127.0638]]}, {"id": 2, "name": "뚝섬 2지역", "desc": "청담대교 북단 상류 450m ~ 성수동 영동대교 북단 하류 710m 사이의 한강호안 및 내수면", "width": 220, "path": [[37.5258, 127.0638], [37.527, 127.056], [37.5283, 127.05], [37.53, 127.0435]]}, {"id": 3, "name": "뚝섬 3지역", "desc": "서울숲 회전 고가시설 ~ 중랑천 합류부 사이의 한강호안 및 내수면", "width": 230, "path": [[37.5315, 127.0415], [37.5355, 127.037], [37.539, 127.035], [37.545, 127.038]]}, {"id": 4, "name": "이촌 1지역", "desc": "중랑천 합류부 ~ 동호대교 북단 하류 300m 사이의 한강호안 및 내수면", "width": 230, "path": [[37.545, 127.038], [37.538, 127.0305], [37.533, 127.0202], [37.5285, 127.014]]}, {"id": 5, "name": "이촌 2지역", "desc": "동호대교 북단 하류 800m ~ 한남대교 북단 상류 380m 사이의 한강호안 및 내수면(전망로 포함)", "width": 230, "path": [[37.5285, 127.014], [37.5265, 127.007], [37.5255, 127.0], [37.524, 126.9945]]}, {"id": 6, "name": "이촌 3지역", "desc": "노들섬 전체, 한강대교 북단 상류 900m(거북선 선착장) ~ 한강대교 북단 교량 사이의 한강호안 및 내수면", "width": 260, "path": [[37.5225, 126.973], [37.5195, 126.9655], [37.5167, 126.9597], [37.515, 126.9545]]}, {"id": 7, "name": "밤섬지역", "desc": "밤섬 전체 및 마포대교 북단 상류 650m ~ 당산철교 북단 상류 500m 사이의 한강호안 및 내수면", "width": 340, "path": [[37.5365, 126.934], [37.535, 126.926], [37.5346, 126.9166], [37.5352, 126.9085]]}, {"id": 8, "name": "망원 1지역", "desc": "양화대교 북단 교량 ~ 합정동 양화대교 북단 하류 550m 사이의 한강호안 및 내수면", "width": 230, "path": [[37.544, 126.9095], [37.543, 126.904], [37.5423, 126.899]]}, {"id": 9, "name": "망원 2지역", "desc": "성산대교 북단 상류 600m 교량 ~ 홍제천 합류부 사이의 한강호안 및 내수면", "width": 260, "path": [[37.55, 126.8995], [37.5525, 126.8933], [37.556, 126.887]]}, {"id": 10, "name": "망원 3지역", "desc": "당산철교 북단 상류 500m ~ 당산철교 북단 교량 사이의 한강호안 및 내수면", "width": 210, "path": [[37.5387, 126.9125], [37.5378, 126.9067], [37.5375, 126.9038]]}, {"id": 11, "name": "난지 1지역", "desc": "홍제천교 ~ 성산대교 북단 하류 1,300m(조정면허시험장 하류 50m) 사이의 한강호안 및 내수면", "width": 300, "path": [[37.556, 126.887], [37.5595, 126.8815], [37.5625, 126.879], [37.5665, 126.874]]}, {"id": 12, "name": "난지 2지역", "desc": "가양대교 북단 상류 800m(난지캠핑장 끝 호안 하류 측) ~ 가양대교 북단 하류 450m 사이의 한강호안 및 내수면(생태습지원 엄격한 내수면 포함)", "width": 340, "path": [[37.5665, 126.874], [37.5695, 126.864], [37.5715, 126.8527], [37.572, 126.8435]]}, {"id": 13, "name": "난지 3지역", "desc": "월드컵대교 북단 하류 750m ~ 월드컵대교 북단 하류 900m 사이의 한강호안 및 내수면", "width": 180, "path": [[37.5575, 126.884], [37.5585, 126.881], [37.5595, 126.8785]]}, {"id": 14, "name": "잠실지역", "desc": "잠실5동 잠실수중보 ~ 잠실수중보 하류 1,300m 사이의 한강호안 및 내수면", "width": 380, "path": [[37.5205, 127.0955], [37.523, 127.104], [37.529, 127.112], [37.538, 127.116], [37.545, 127.111]]}, {"id": 15, "name": "잠원1지역", "desc": "동호대교 남단 하류 300m(리버시티) ~ 한남대교 남단 하류 1,000m(요트클럽 하류 100m) 사이의 한강호안 및 내수면", "width": 250, "path": [[37.5205, 127.022], [37.5192, 127.014], [37.5187, 127.006], [37.5178, 126.999]]}, {"id": 16, "name": "반포 1지역", "desc": "반포동 반포대교 남단 상류 200m(전망데크) ~ 하류 500m(임시선착장) 사이의 한강호안 및 내수면", "width": 230, "path": [[37.5152, 126.999], [37.512, 126.995], [37.5108, 126.9895]]}, {"id": 17, "name": "반포 2지역", "desc": "동작대교 남단 상류 450m(서래섬 하류 100m) ~ 동작대교 남단 하류 280m 사이의 한강호안 및 내수면", "width": 240, "path": [[37.512, 126.9845], [37.5107, 126.9785], [37.5095, 126.9725]]}, {"id": 18, "name": "흑석지역", "desc": "한강대교 남단 상류 1,360m(한강현대아파트 114동 앞) ~ 본동 한강철교 남단 상류 400m 사이의 한강호안 및 내수면", "width": 260, "path": [[37.5095, 126.9725], [37.5077, 126.956], [37.5082, 126.9465]]}, {"id": 19, "name": "여의도 1지역", "desc": "원효대교 남단 상류 430m ~ 서강대교 남단 하류 370m 사이의 한강호안 및 내수면", "width": 300, "path": [[37.5268, 126.947], [37.5263, 126.935], [37.529, 126.9225]]}, {"id": 20, "name": "여의도 2지역", "desc": "여의도동 샛강 내수면 전역(상·하류 합류부 및 연결한 내수면 포함)", "width": 260, "path": [[37.5188, 126.944], [37.5188, 126.935], [37.5188, 126.927], [37.52, 126.9155]]}, {"id": 21, "name": "양화 1지역", "desc": "당산철교 남단 상류 370m(여의도 샛강 하류 합류부) ~ 당산철교 남단 60m(해양소년단 수상훈련장)의 한강호안 및 내수면", "width": 230, "path": [[37.5327, 126.912], [37.5327, 126.9062], [37.5325, 126.903]]}, {"id": 22, "name": "양화 2지역", "desc": "선유도공원 전체 및 성산대교 남단 상류 600m ~ 안양천 합류부 상류 150m 사이의 한강호안 및 내수면", "width": 320, "path": [[37.5435, 126.904], [37.542, 126.8958], [37.541, 126.8865], [37.5405, 126.878]]}, {"id": 23, "name": "양화3, 강서 1지역", "desc": "염창동 안양천 합류부 하류 150m ~ 마곡철교 남단 하류 400m 사이의 한강호안 및 내수면", "width": 360, "path": [[37.555, 126.867], [37.555, 126.8515], [37.558, 126.835], [37.566, 126.817]]}, {"id": 24, "name": "강서 2지역", "desc": "방화대교 남단 하류 50m ~ 행주대교 남단 상류 400m 사이의 한강호안 및 내수면", "width": 360, "path": [[37.566, 126.817], [37.575, 126.811], [37.585, 126.81], [37.595, 126.809]]}];

const map = L.map('map', {
  zoomControl: true,
  preferCanvas: true
}).setView([37.535, 126.98], 12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function hav(a,b,c,d){
  const R=6371000,toRad=Math.PI/180;
  const p1=a*toRad,p2=c*toRad,dp=(c-a)*toRad,dl=(d-b)*toRad;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function distancePointToSegmentMeters(lat, lng, lat1, lng1, lat2, lng2){
  // equirectangular projection around current latitude
  const R = 6371000;
  const toRad = Math.PI/180;
  const x = lng * toRad * Math.cos(lat * toRad) * R;
  const y = lat * toRad * R;
  const x1 = lng1 * toRad * Math.cos(lat * toRad) * R;
  const y1 = lat1 * toRad * R;
  const x2 = lng2 * toRad * Math.cos(lat * toRad) * R;
  const y2 = lat2 * toRad * R;

  const dx = x2 - x1, dy = y2 - y1;
  if(dx === 0 && dy === 0) return Math.hypot(x-x1, y-y1);
  let t = ((x-x1)*dx + (y-y1)*dy) / (dx*dx + dy*dy);
  t = Math.max(0, Math.min(1, t));
  const px = x1 + t*dx, py = y1 + t*dy;
  return Math.hypot(x-px, y-py);
}

function distanceToZone(lat,lng,z){
  let best = Infinity;
  for(let i=0;i<z.path.length-1;i++){
    const a=z.path[i], b=z.path[i+1];
    best = Math.min(best, distancePointToSegmentMeters(lat,lng,a[0],a[1],b[0],b[1]));
  }
  return best;
}

function judgeZones(lat,lng){
  return zones.map(z=>{
    const dist = distanceToZone(lat,lng,z);
    return {
      ...z,
      dist,
      inside: dist <= z.width
    };
  }).sort((a,b)=>a.dist-b.dist);
}

const zoneGroup = L.layerGroup().addTo(map);
zones.forEach(z=>{
  const line = L.polyline(z.path, {
    color:'#e90068',
    weight: Math.max(8, Math.min(18, z.width/18)),
    opacity:.78,
    lineCap:'round',
    lineJoin:'round'
  }).addTo(zoneGroup);

  const halo = L.polyline(z.path, {
    color:'#e90068',
    weight: Math.max(22, Math.min(42, z.width/8)),
    opacity:.13,
    lineCap:'round',
    lineJoin:'round'
  }).addTo(zoneGroup);

  const mid = z.path[Math.floor(z.path.length/2)];
  const icon = L.divIcon({
    className:'',
    html:`<div class="zoneLabel">${z.id}</div>`,
    iconSize:[28,28],
    iconAnchor:[14,14]
  });
  L.marker(mid, {icon}).addTo(zoneGroup);

  const popup = `<b>${z.id}. ${z.name}</b><br>${z.desc}<br><small>※ 미래한강본부 자료 기반 보조 표시입니다.</small>`;
  line.bindPopup(popup);
  halo.bindPopup(popup);
}));

let userMarker = null;
let accuracyCircle = null;
let watchId = null;

function updateLocation(pos){
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const acc = pos.coords.accuracy || 0;

  if(userMarker) map.removeLayer(userMarker);
  if(accuracyCircle) map.removeLayer(accuracyCircle);

  const userIcon = L.divIcon({
    className:'',
    html:'<div class="userDot"></div>',
    iconSize:[16,16],
    iconAnchor:[8,8]
  });

  userMarker = L.marker([lat,lng],{icon:userIcon}).addTo(map).bindPopup('현재 위치');
  accuracyCircle = L.circle([lat,lng], {
    radius:acc,
    color:'#1677ff',
    fillColor:'#1677ff',
    fillOpacity:.08,
    weight:1
  }).addTo(map);

  map.setView([lat,lng], Math.max(map.getZoom(), 16));

  const judged = judgeZones(lat,lng);
  const insideList = judged.filter(z=>z.inside);
  const nearest = judged[0];

  let html = '';
  if(insideList.length > 0){
    html += `🔴 <b>낚시금지구역 안으로 추정됩니다.</b><br>`;
    html += `해당 구역: <b>${insideList[0].id}. ${insideList[0].name}</b><br>`;
    html += `구역선까지 거리: 약 ${Math.round(insideList[0].dist)}m<br>`;
  } else if(nearest.dist <= nearest.width + 80){
    html += `🟠 <b>금지구역 경계 근처입니다.</b><br>`;
    html += `가장 가까운 구역: <b>${nearest.id}. ${nearest.name}</b><br>`;
    html += `구역선까지 거리: 약 ${Math.round(nearest.dist)}m<br>`;
  } else {
    html += `🟢 <b>등록된 금지구역 밖으로 추정됩니다.</b><br>`;
    html += `가장 가까운 구역: <b>${nearest.id}. ${nearest.name}</b><br>`;
    html += `구역선까지 거리: 약 ${Math.round(nearest.dist)}m<br>`;
  }

  html += `GPS 정확도: ±${Math.round(acc)}m<br>`;
  html += `좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>`;
  html += `<small>※ 실사용 보조판정입니다. 현장 안내판·통제선·최신 고시가 최종 우선입니다.</small>`;
  document.getElementById('status').innerHTML = html;
}

function locateMe(){
  const status=document.getElementById('status');
  if(!navigator.geolocation){
    status.innerHTML='이 브라우저는 GPS를 지원하지 않습니다.';
    return;
  }
  status.innerHTML='📍 위치 확인 중입니다. 권한 요청이 뜨면 허용을 눌러주세요.';
  navigator.geolocation.getCurrentPosition(updateLocation, err=>{
    status.innerHTML='<b>위치 확인 실패</b><br>'+err.message+'<br>Safari 설정에서 위치 접근을 허용하세요.';
  }, {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:0
  });
}

const bounds = L.latLngBounds(zones.flatMap(z=>z.path));
map.fitBounds(bounds.pad(0.12));
</script>
</body>
</html>
