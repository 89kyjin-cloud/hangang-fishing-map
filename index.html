<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한강 낚시금지구역 정밀 좌표화 도구 v12</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
#map{height:100vh;width:100vw}
.panel{position:absolute;left:12px;top:12px;z-index:999;background:white;border-radius:14px;padding:12px 14px;box-shadow:0 4px 18px #0003;width:min(430px,calc(100vw - 24px));font-size:13px;line-height:1.45}
.panel b{color:#0b6f3a}
.btns{position:absolute;right:12px;top:12px;z-index:999;display:flex;flex-direction:column;gap:8px}
button{border:0;border-radius:999px;background:#fff;color:#0b6f3a;font-weight:900;padding:11px 14px;box-shadow:0 4px 18px #0003}
.side{position:absolute;right:12px;top:160px;z-index:999;background:white;border-radius:14px;padding:12px;box-shadow:0 4px 18px #0003;max-height:65vh;overflow:auto;width:min(400px,calc(100vw - 24px));font-size:13px;display:none}
.item{border:1px solid #eee;border-radius:10px;margin:6px 0;padding:8px;cursor:pointer}
.item b{color:#e90068}
.legend{position:absolute;left:12px;bottom:12px;z-index:999;background:white;border-radius:12px;padding:10px 12px;box-shadow:0 4px 18px #0003;font-size:13px}
.zoneLabel{background:#e90068;color:white;border-radius:999px;width:28px;height:28px;line-height:28px;text-align:center;font-weight:900;border:2px solid white;box-shadow:0 2px 8px #0005}
.ref{position:absolute;left:12px;bottom:70px;z-index:999;background:rgba(255,255,255,.96);border-radius:12px;padding:10px 12px;box-shadow:0 4px 18px #0003;font-size:12px;width:min(430px,calc(100vw - 24px))}
select,input{width:100%;padding:8px;margin:4px 0;border:1px solid #ddd;border-radius:8px}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <b>정밀 좌표화 도구 v12</b><br>
  자동 계산이 아니라 실제 지도 위에서 구역을 직접 그려서 저장하는 방식입니다.<br>
  ① 구역 선택 → ② 지도 위 금지구간을 선으로 그림 → ③ 저장 → ④ GeoJSON 다운로드<br>
  <b style="color:#e90068">이 방식이 현재 가장 정확합니다.</b>
  <select id="zoneSelect"></select>
  <input id="memo" placeholder="비고 예: 북단 호안, 전망데크, 섬 전체 등">
</div>

<div class="btns">
  <button onclick="toggleList()">구역목록</button>
  <button onclick="downloadGeoJSON()">GeoJSON 저장</button>
  <button onclick="clearAll()">전체삭제</button>
</div>

<div class="side" id="side"><b>금지구역 22개</b><div id="zoneList"></div></div>

<div class="ref">
  <b>사용법</b><br>
  지도 왼쪽의 그리기 버튼 중 <b>polyline</b>을 선택해서 금지구역을 따라 그리세요.<br>
  섬/샛강처럼 면 전체는 <b>polygon</b>으로 그리세요.<br>
  저장한 GeoJSON이 최종 GPS 판정 지도에 들어갑니다.
</div>

<div class="legend">🔴 직접 그린 금지구역 · 🟢 나머지 한강 수면은 허가구역</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
const zones = [
[1,"뚝섬 1지역","자양2동 잠실수중보 ~ 청담대교 상류 670m"],
[2,"뚝섬 2지역","청담대교 북단 교량 ~ 영동대교 북단 하류 710m"],
[3,"뚝섬 3지역","서울숲 회전고가시설 ~ 중랑천 합류부"],
[4,"이촌 1지역","중랑천 합류부 ~ 동호대교 북단 교량"],
[5,"이촌 2지역","동호대교 북단 하류 800m ~ 한남대교 북단 상류 380m 전망데크"],
[6,"이촌 3지역","노들섬 전체 + 한강대교 북단 상류 900m ~ 한강대교 북단 교량"],
[7,"밤섬지역","밤섬 전체 + 마포대교 북단 상류 650m ~ 당산철교 북단 상류 500m"],
[8,"망원 1지역","양화대교 북단 교량 ~ 양화대교 북단 하류 550m"],
[9,"망원 2지역","성산대교 북단 교량 ~ 홍제천 합류부"],
[10,"난지 1지역","홍제천교 ~ 성산대교 북단 하류 1,300m"],
[11,"난지 2지역","가양대교 북단 상류 800m ~ 가양대교 북단 하류 450m"],
[12,"잠실지역","잠실수중보 ~ 잠실수중보 하류 500m"],
[13,"잠원지역","동호대교 남단 하류 300m ~ 한남대교 남단 하류 1,000m"],
[14,"반포 1지역","반포대교 남단 상류 200m ~ 하류 500m"],
[15,"반포 2지역","동작대교 남단 상류 450m ~ 동작대교 남단 하류 280m"],
[16,"흑석 지역","한강대교 남단 상류 760m ~ 한강철교 남단 상류 400m"],
[17,"여의도 1지역","원효대교 남단 상류 430m ~ 서강대교 남단 교량"],
[18,"여의도 2지역","여의도동 샛강 내수면 전역"],
[19,"양화 1지역","당산철교 남단 상류 370m ~ 당산철교 남단 60m"],
[20,"양화 2지역","선유도공원 전체 + 성산대교 남단 상류 550m ~ 안양천 합류부 상류 150m"],
[21,"양화3, 강서1 지역","안양천 합류부 하류 150m ~ 마곡철교 남단 하류 400m"],
[22,"강서 2지역","방화대교 남단 하류 50m ~ 행주대교 남단 상류 400m"]
];

const map = L.map('map').setView([37.535,126.975],12);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const satellite = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenTopoMap'});
L.control.layers({"기본지도":osm,"지형지도":satellite}).addTo(map);

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

const drawControl = new L.Control.Draw({
  edit: { featureGroup: drawnItems },
  draw: {
    polygon: { shapeOptions:{color:'#e90068',weight:3,fillOpacity:.35} },
    polyline: { shapeOptions:{color:'#e90068',weight:6,opacity:.85} },
    rectangle:false,
    circle:false,
    circlemarker:false,
    marker:false
  }
});
map.addControl(drawControl);

const zoneSelect = document.getElementById('zoneSelect');
const zoneList = document.getElementById('zoneList');
zones.forEach(z=>{
  const opt=document.createElement('option');
  opt.value=z[0];
  opt.textContent=`${z[0]}. ${z[1]}`;
  zoneSelect.appendChild(opt);

  const div=document.createElement('div');
  div.className='item';
  div.innerHTML=`<b>${z[0]}. ${z[1]}</b><br><small>${z[2]}</small>`;
  div.onclick=()=>{ zoneSelect.value=z[0]; };
  zoneList.appendChild(div);
});

map.on(L.Draw.Event.CREATED, function(e) {
  const layer = e.layer;
  const zid = parseInt(zoneSelect.value);
  const z = zones.find(x=>x[0]===zid);
  const memo = document.getElementById('memo').value || "";
  layer.feature = layer.feature || {type:"Feature",properties:{}};
  layer.feature.properties = {
    id:zid,
    name:z[1],
    description:z[2],
    memo:memo,
    source:"manual digitizing v12"
  };
  layer.bindPopup(`<b>${zid}. ${z[1]}</b><br>${z[2]}<br><small>${memo}</small>`);
  drawnItems.addLayer(layer);
});

function toggleList(){
  const s=document.getElementById('side');
  s.style.display=s.style.display==='block'?'none':'block';
}

function downloadGeoJSON(){
  const geo = drawnItems.toGeoJSON();
  geo.name = "hangang_fishing_forbidden_zones_manual_v12";
  const blob = new Blob([JSON.stringify(geo,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "hangang_fishing_forbidden_zones_manual_v12.geojson";
  a.click();
  URL.revokeObjectURL(url);
}

function clearAll(){
  if(confirm("직접 그린 모든 구역을 삭제할까요?")) drawnItems.clearLayers();
}
</script>
</body>
</html>
