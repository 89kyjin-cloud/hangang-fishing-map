<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한강 낚시금지구역 GPS 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--green:#0b6f3a;--red:#e90068;--blue:#1677ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;overflow:hidden}
header{height:54px;background:linear-gradient(90deg,#0b6f3a,#11864b);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 2px 10px #0002;z-index:1000;position:relative}
h1{font-size:17px;margin:0} header span{font-size:12px;opacity:.9}
#map{width:100vw;height:calc(100vh - 54px)}
.status{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1000;background:rgba(255,255,255,.96);border:1px solid #d9e5d9;border-radius:16px;box-shadow:0 6px 24px #0003;padding:12px 14px;font-size:13px;line-height:1.45;max-height:38vh;overflow:auto}
.status b{color:#0b6f3a}
.locBtn{position:absolute;right:12px;top:66px;z-index:1000;border:0;border-radius:999px;background:white;color:#0b6f3a;font-weight:900;padding:11px 15px;box-shadow:0 4px 16px #0003;font-size:14px}
.legend{position:absolute;left:12px;top:66px;z-index:1000;background:rgba(255,255,255,.94);border:1px solid #d9e5d9;border-radius:14px;box-shadow:0 4px 16px #0002;padding:10px 12px;font-size:12px;line-height:1.4;max-width:260px}
.legend b{color:#0b6f3a}
.zoneLabel{background:#e90068;color:#fff;border:2px solid #fff;border-radius:999px;width:28px;height:28px;text-align:center;line-height:24px;font-weight:900;box-shadow:0 2px 8px #0005}
.userDot{background:#1677ff;border:3px solid white;border-radius:999px;width:18px;height:18px;box-shadow:0 0 0 6px rgba(22,119,255,.22),0 3px 12px #0005}
.leaflet-popup-content{font-size:14px;line-height:1.45}
@media(max-width:700px){
 header span{display:none}
 h1{font-size:16px}
 .legend{font-size:11px;max-width:210px}
 .status{font-size:12px}
 .locBtn{font-size:13px;padding:10px 13px}
}
</style>
</head>
<body>
<header><h1>🚫 한강 낚시금지구역 GPS 지도</h1><span>실제 지도 기반 · GPS 보조 판정</span></header>
<div id="map"></div>
<button class="locBtn" onclick="locateMe()">📍 내 위치</button>
<div class="legend"><b>사용 방법</b><br>분홍색 구역을 누르면 설명이 표시됩니다.<br>내 위치를 누르면 현재 위치 기준으로 금지구역 여부를 계산합니다.</div>
<div id="status" class="status">📍 <b>내 위치</b> 버튼을 눌러 현재 위치를 확인하세요.<br><small>※ 현장 안내판·통제선·최신 고시가 우선입니다.</small></div>
<script>
const zones = [{"id": 1, "name": "뚝섬 1지역", "desc": "자양2동 잠실수중보 ~ 청담대교 상류 670m 사이의 한강호안 및 내수면", "lat": 37.5249, "lng": 127.0715, "r": 1900}, {"id": 2, "name": "뚝섬 2지역", "desc": "청담대교 북단 상류 450m ~ 성수동 영동대교 북단 하류 710m 사이의 한강호안 및 내수면", "lat": 37.5282, "lng": 127.05, "r": 1500}, {"id": 3, "name": "뚝섬 3지역", "desc": "서울숲 회전 고가시설 ~ 중랑천 합류부 사이의 한강호안 및 내수면", "lat": 37.5383, "lng": 127.0352, "r": 900}, {"id": 4, "name": "이촌 1지역", "desc": "중랑천 합류부 ~ 동호대교 북단 하류 300m 사이의 한강호안 및 내수면", "lat": 37.533, "lng": 127.0202, "r": 750}, {"id": 5, "name": "이촌 2지역", "desc": "동호대교 북단 하류 800m ~ 한남대교 북단 상류 380m 사이의 한강호안 및 내수면(전망로 포함)", "lat": 37.5272, "lng": 127.006, "r": 900}, {"id": 6, "name": "이촌 3지역", "desc": "노들섬 전체, 한강대교 북단 상류 900m(거북선 선착장) ~ 한강대교 북단 교량 사이의 한강호안 및 내수면", "lat": 37.5167, "lng": 126.9597, "r": 1000}, {"id": 7, "name": "밤섬지역", "desc": "밤섬 전체 및 마포대교 북단 상류 650m ~ 당산철교 북단 상류 500m 사이의 한강호안 및 내수면", "lat": 37.5346, "lng": 126.9166, "r": 1200}, {"id": 8, "name": "망원 1지역", "desc": "양화대교 북단 교량 ~ 합정동 양화대교 북단 하류 550m 사이의 한강호안 및 내수면", "lat": 37.5428, "lng": 126.904, "r": 700}, {"id": 9, "name": "망원 2지역", "desc": "성산대교 북단 상류 600m 교량 ~ 홍제천 합류부 사이의 한강호안 및 내수면", "lat": 37.5525, "lng": 126.8933, "r": 900}, {"id": 10, "name": "망원 3지역", "desc": "당산철교 북단 상류 500m ~ 당산철교 북단 교량 사이의 한강호안 및 내수면", "lat": 37.5378, "lng": 126.9067, "r": 600}, {"id": 11, "name": "난지 1지역", "desc": "홍제천교 ~ 성산대교 북단 하류 1,300m(조정면허시험장 하류 50m) 사이의 한강호안 및 내수면", "lat": 37.5625, "lng": 126.879, "r": 1100}, {"id": 12, "name": "난지 2지역", "desc": "가양대교 북단 상류 800m(난지캠핑장 끝 호안 하류 측) ~ 가양대교 북단 하류 450m 사이의 한강호안 및 내수면(생태습지원 엄격한 내수면 포함)", "lat": 37.5715, "lng": 126.8527, "r": 1100}, {"id": 13, "name": "난지 3지역", "desc": "월드컵대교 북단 하류 750m ~ 월드컵대교 북단 하류 900m 사이의 한강호안 및 내수면", "lat": 37.5585, "lng": 126.881, "r": 450}, {"id": 14, "name": "잠실지역", "desc": "잠실5동 잠실수중보 ~ 잠실수중보 하류 1,300m 사이의 한강호안 및 내수면", "lat": 37.5185, "lng": 127.1042, "r": 2800}, {"id": 15, "name": "잠원1지역", "desc": "동호대교 남단 하류 300m(리버시티) ~ 한남대교 남단 하류 1,000m(요트클럽 하류 100m) 사이의 한강호안 및 내수면", "lat": 37.5187, "lng": 127.0137, "r": 1000}, {"id": 16, "name": "반포 1지역", "desc": "반포동 반포대교 남단 상류 200m(전망데크) ~ 하류 500m(임시선착장) 사이의 한강호안 및 내수면", "lat": 37.512, "lng": 126.995, "r": 700}, {"id": 17, "name": "반포 2지역", "desc": "동작대교 남단 상류 450m(서래섬 하류 100m) ~ 동작대교 남단 하류 280m 사이의 한강호안 및 내수면", "lat": 37.5107, "lng": 126.9785, "r": 750}, {"id": 18, "name": "흑석지역", "desc": "한강대교 남단 상류 1,360m(한강현대아파트 114동 앞) ~ 본동 한강철교 남단 상류 400m 사이의 한강호안 및 내수면", "lat": 37.5077, "lng": 126.956, "r": 1000}, {"id": 19, "name": "여의도 1지역", "desc": "원효대교 남단 상류 430m ~ 서강대교 남단 하류 370m 사이의 한강호안 및 내수면", "lat": 37.5263, "lng": 126.935, "r": 1000}, {"id": 20, "name": "여의도 2지역", "desc": "여의도동 샛강 내수면 전역(상·하류 합류부 및 연결한 내수면 포함)", "lat": 37.5188, "lng": 126.927, "r": 1050}, {"id": 21, "name": "양화 1지역", "desc": "당산철교 남단 상류 370m(여의도 샛강 하류 합류부) ~ 당산철교 남단 60m(해양소년단 수상훈련장)의 한강호안 및 내수면", "lat": 37.5327, "lng": 126.9062, "r": 650}, {"id": 22, "name": "양화 2지역", "desc": "선유도공원 전체 및 성산대교 남단 상류 600m ~ 안양천 합류부 상류 150m 사이의 한강호안 및 내수면", "lat": 37.542, "lng": 126.8958, "r": 1100}, {"id": 23, "name": "양화3, 강서 1지역", "desc": "염창동 안양천 합류부 하류 150m ~ 마곡철교 남단 하류 400m 사이의 한강호안 및 내수면", "lat": 37.555, "lng": 126.8515, "r": 1300}, {"id": 24, "name": "강서 2지역", "desc": "방화대교 남단 하류 50m ~ 행주대교 남단 상류 400m 사이의 한강호안 및 내수면", "lat": 37.585, "lng": 126.81, "r": 1300}];

const map = L.map('map', {
  zoomControl: true,
  preferCanvas: true
}).setView([37.535, 126.98], 12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const redStyle = {
  color:'#e90068',
  weight:2,
  fillColor:'#e90068',
  fillOpacity:0.16
};

const zoneLayers = [];
zones.forEach(z => {
  const circle = L.circle([z.lat,z.lng], {
    radius:z.r,
    ...redStyle
  }).addTo(map);

  circle.bindPopup(`<b>${z.id}. ${z.name}</b><br>${z.desc}<br><small>※ 원본 자료 기반 보조 표시입니다.</small>`);
  zoneLayers.push(circle);

  const icon = L.divIcon({
    className:'',
    html:`<div class="zoneLabel">${z.id}</div>`,
    iconSize:[28,28],
    iconAnchor:[14,14]
  });
  L.marker([z.lat,z.lng], {icon}).addTo(map).bindPopup(`<b>${z.id}. ${z.name}</b><br>${z.desc}`);
}));

let userMarker = null;
let accuracyCircle = null;

function hav(a,b,c,d){
  const R=6371000,toRad=Math.PI/180;
  const p1=a*toRad,p2=c*toRad,dp=(c-a)*toRad,dl=(d-b)*toRad;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function nearestZones(lat,lng){
  return zones.map(z=>({
    ...z,
    dist:hav(lat,lng,z.lat,z.lng),
    inside:hav(lat,lng,z.lat,z.lng)<=z.r
  })).sort((a,b)=>a.dist-b.dist);
}

function updateLocation(pos){
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;
  const acc=pos.coords.accuracy || 0;

  if(userMarker) map.removeLayer(userMarker);
  if(accuracyCircle) map.removeLayer(accuracyCircle);

  const userIcon=L.divIcon({
    className:'',
    html:'<div class="userDot"></div>',
    iconSize:[18,18],
    iconAnchor:[9,9]
  });

  userMarker=L.marker([lat,lng],{icon:userIcon}).addTo(map).bindPopup('현재 위치');
  accuracyCircle=L.circle([lat,lng],{
    radius:acc,
    color:'#1677ff',
    fillColor:'#1677ff',
    fillOpacity:.08,
    weight:1
  }).addTo(map);

  map.setView([lat,lng], 16);

  const near=nearestZones(lat,lng);
  const insideList=near.filter(z=>z.inside);
  const first=near[0];

  let html='';
  if(insideList.length>0){
    html += `🔴 <b>낚시금지구역 안으로 추정됩니다.</b><br>`;
    html += `해당 구역: <b>${insideList[0].name}</b><br>`;
  } else {
    html += `🟢 <b>등록된 금지구역 밖으로 추정됩니다.</b><br>`;
    html += `가장 가까운 구역: <b>${first.name}</b> · 약 ${Math.round(first.dist)}m<br>`;
  }

  html += `GPS 정확도: ±${Math.round(acc)}m<br>`;
  html += `좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>`;
  html += `<small>※ 이 판정은 보조용입니다. 실제 금지구역은 현장 표지판·통제선·최신 고시가 우선입니다.</small>`;

  document.getElementById('status').innerHTML=html;
}

function locateMe(){
  const status=document.getElementById('status');
  if(!navigator.geolocation){
    status.innerHTML='이 브라우저는 GPS를 지원하지 않습니다.';
    return;
  }
  status.innerHTML='📍 위치 확인 중입니다. 권한 요청이 뜨면 허용을 눌러주세요.';
  navigator.geolocation.getCurrentPosition(updateLocation, err=>{
    status.innerHTML='<b>위치 확인 실패</b><br>'+err.message+'<br>Safari 설정에서 위치 접근을 허용하세요.';
  }, {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:0
  });
}

const bounds = L.latLngBounds(zones.map(z=>[z.lat,z.lng]));
map.fitBounds(bounds.pad(0.15));
</script>
</body>
</html>
