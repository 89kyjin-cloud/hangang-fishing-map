<script>

// === GPS 정밀 현재 위치 금지구역 판정 기능 v73 ===
// 방식: 고정밀 GPS 다중 샘플 수집 → 정확도 가중 평균 + 최저오차 샘플 검증 → 금지구역 포함/경계거리 판정
let myLocationMarker = null;
let myAccuracyCircle = null;
let gpsWatchId = null;
let gpsSamples = [];

function pointInRing(pt, ring){
  const x = pt[0], y = pt[1];
  let inside = false;
  for(let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

function pointInPolygonCoords(pt, coords){
  if(!coords || !coords.length) return false;
  if(!pointInRing(pt, coords[0])) return false;
  for(let i=1; i<coords.length; i++){
    if(pointInRing(pt, coords[i])) return false;
  }
  return true;
}

function pointInFeature(pt, feature){
  const g = feature.geometry;
  if(!g) return false;
  if(g.type === 'Polygon') return pointInPolygonCoords(pt, g.coordinates);
  if(g.type === 'MultiPolygon') return g.coordinates.some(poly => pointInPolygonCoords(pt, poly));
  return false;
}

function findForbiddenZone(lat, lng){
  const pt = [lng, lat];
  for(const f of forbidden.features){
    if(pointInFeature(pt, f)) return f;
  }
  return null;
}

function findWaterLeisureZone(lat, lng){
  const pt = [lng, lat];
  if(typeof waterLeisureForbidden === 'undefined' || !waterLeisureForbidden.features) return null;
  for(const f of waterLeisureForbidden.features){
    if(pointInFeature(pt, f)) return f;
  }
  return null;
}

function toRad(d){return d*Math.PI/180;}
function metersPerDegLat(){return 111320;}
function metersPerDegLng(lat){return 111320*Math.cos(toRad(lat));}

function pointSegDistM(px, py, ax, ay, bx, by){
  const mx = metersPerDegLng(py), my = metersPerDegLat();
  const x = px*mx, y = py*my, x1 = ax*mx, y1 = ay*my, x2 = bx*mx, y2 = by*my;
  const dx = x2-x1, dy = y2-y1;
  if(dx===0 && dy===0) return Math.hypot(x-x1, y-y1);
  let t = ((x-x1)*dx + (y-y1)*dy) / (dx*dx + dy*dy);
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(x-(x1+t*dx), y-(y1+t*dy));
}

function distToRingM(lng, lat, ring){
  let best = Infinity;
  for(let i=0; i<ring.length-1; i++){
    best = Math.min(best, pointSegDistM(lng, lat, ring[i][0], ring[i][1], ring[i+1][0], ring[i+1][1]));
  }
  return best;
}

function distToFeatureBoundaryM(lat, lng, feature){
  const g = feature.geometry;
  let best = Infinity;
  if(!g) return best;
  if(g.type === 'Polygon'){
    for(const ring of g.coordinates) best = Math.min(best, distToRingM(lng, lat, ring));
  }else if(g.type === 'MultiPolygon'){
    for(const poly of g.coordinates){
      for(const ring of poly) best = Math.min(best, distToRingM(lng, lat, ring));
    }
  }
  return best;
}

function nearestForbiddenBoundary(lat, lng){
  let best = {dist: Infinity, feature: null};
  for(const f of forbidden.features){
    const d = distToFeatureBoundaryM(lat, lng, f);
    if(d < best.dist) best = {dist:d, feature:f};
  }
  return best;
}

function weightedAverage(samples){
  // 정확도 좋은 샘플에 높은 가중치. accuracy가 낮을수록 가중치 커짐.
  let sw=0, slat=0, slng=0, best=samples[0];
  for(const s of samples){
    if(s.acc < best.acc) best = s;
    const w = 1 / Math.max(5, s.acc) ** 2;
    sw += w; slat += s.lat*w; slng += s.lng*w;
  }
  const avg = {lat: slat/sw, lng: slng/sw, acc: best.acc, bestAcc: best.acc, count: samples.length};
  // 평균점이 최저오차점과 너무 벌어지면 최저오차점 우선
  const gap = pointSegDistM(avg.lng, avg.lat, best.lng, best.lat, best.lng, best.lat);
  if(gap > Math.max(15, best.acc * 1.5)) return {...best, bestAcc: best.acc, count: samples.length};
  return avg;
}

function updateGpsBox(htmlText){
  const box = document.getElementById('gpsbox');
  if(!box) return;
  box.style.display = 'block';
  box.innerHTML = htmlText;
}

function renderLocationResult(loc){
  const lat = loc.lat, lng = loc.lng, acc = Math.round(loc.acc || 0);
  const zone = findForbiddenZone(lat, lng);
  const leisureZone = findWaterLeisureZone(lat, lng);
  const near = nearestForbiddenBoundary(lat, lng);
  const nearDist = Math.round(near.dist);
  const cautionDist = Math.max(20, acc); // GPS 오차와 20m 중 큰 값

  if(myLocationMarker) map.removeLayer(myLocationMarker);
  if(myAccuracyCircle) map.removeLayer(myAccuracyCircle);

  myLocationMarker = L.marker([lat, lng]).addTo(map).bindPopup('현재 위치').openPopup();
  myAccuracyCircle = L.circle([lat, lng], {
    radius: acc || 10,
    color: '#1677ff',
    weight: 2,
    fillColor: '#1677ff',
    fillOpacity: 0.12
  }).addTo(map);

  map.flyTo([lat, lng], 19, {animate:true, duration:1.2});
      setTimeout(() => {
        try {
          const b = myAccuracyCircle ? myAccuracyCircle.getBounds() : L.latLng(lat,lng).toBounds(60);
          map.fitBounds(b.pad(1.8), {padding:[60,60], maxZoom:19});
        } catch(e) {
          map.setView([lat, lng], 19);
        }
      }, 1300);

  let accuracyText = '<div class="gpssmall">좌표: ' + lat.toFixed(7) + ', ' + lng.toFixed(7) +
    '<br>GPS 최저오차: 약 ' + acc + 'm · 샘플 ' + (loc.count || 1) + '개' +
    '<br>가장 가까운 낚시금지구역 경계까지 약 ' + nearDist + 'm</div>';

  if(leisureZone){
    accuracyText = '<div style="margin:6px 0;padding:6px;border-radius:8px;background:#f2eaff;color:#4d168f;font-weight:900">수상레저 금지구역 해당: ' +
      (leisureZone.properties.id || '') + ' ' + (leisureZone.properties.name || '') +
      '<br><span style="font-weight:500">' + (leisureZone.properties.description || '') + '</span></div>' + accuracyText;
  }else{
    accuracyText = '<div style="margin:6px 0;padding:6px;border-radius:8px;background:#f8f8f8;color:#555">수상레저 금지구역: 지도상 해당 없음</div>' + accuracyText;
  }

  if(zone){
    const boundaryMsg = near.dist <= cautionDist ? '<br><span class="warn">경계 인접: GPS 오차 범위 안입니다. 현장 표지판을 우선 확인하세요.</span>' : '';
    updateGpsBox(
      '<b class="ban">현재 위치: 금지구역</b><br>' +
      '구역: <b>' + zone.properties.id + '번 ' + (zone.properties.name || '') + '</b><br>' +
      (zone.properties.description ? zone.properties.description + '<br>' : '') +
      accuracyText + boundaryMsg
    );
  }else{
    if(near.dist <= cautionDist){
      updateGpsBox(
        '<b class="near">현재 위치: 경계 인접</b><br>' +
        '지도상 금지구역 밖이지만, GPS 오차 범위 안에 금지구역 경계가 있습니다.<br>' +
        '가까운 구역: <b>' + (near.feature ? near.feature.properties.id + '번 ' + (near.feature.properties.name || '') : '') + '</b><br>' +
        accuracyText + '<br><span class="warn">현장 표지판·공식 고시 기준으로 판단하세요.</span>'
      );
    }else{
      updateGpsBox(
        '<b class="ok">현재 위치: 금지구역 아님</b><br>' +
        '지도상 등록된 금지구역 밖입니다.<br>' +
        accuracyText + '<br><span class="warn">경계 부근이나 GPS 신호 불량 시 현장 표지판·공식 고시를 우선 확인하세요.</span>'
      );
    }
  }
}

function checkMyLocation(){
  if(!navigator.geolocation){
    updateGpsBox('<b>GPS 사용 불가</b><br>이 브라우저에서 위치 기능을 지원하지 않습니다.');
    return;
  }

  gpsSamples = [];
  updateGpsBox('<b>정밀 GPS 확인 중...</b><br>8초 동안 여러 위치값을 수집해 가장 정확한 값으로 판정합니다.<br><span class="gpssmall">휴대폰 위치 권한을 허용하고, 가능하면 하늘이 보이는 곳에서 잠시 멈춰 주세요.</span>');

  if(gpsWatchId !== null){
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }

  const started = Date.now();
  let finished = false;

  function finish(){
    if(finished) return;
    finished = true;
    if(gpsWatchId !== null){
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
    if(!gpsSamples.length){
      updateGpsBox('<b>GPS 오류</b><br>위치 샘플을 얻지 못했습니다. 다시 시도해 주세요.');
      return;
    }
    // 정확도 50m 이하 우선, 없으면 전체 중 최선
    const good = gpsSamples.filter(s => s.acc <= 50);
    const selected = weightedAverage(good.length ? good : gpsSamples);
    renderLocationResult(selected);
  }

  gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const s = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        acc: pos.coords.accuracy || 9999,
        t: Date.now()
      };
      gpsSamples.push(s);
      gpsSamples = gpsSamples.slice(-20);

      const bestAcc = Math.round(Math.min(...gpsSamples.map(x => x.acc)));
      updateGpsBox('<b>정밀 GPS 확인 중...</b><br>수집된 위치값: ' + gpsSamples.length + '개<br>현재 최저오차: 약 ' + bestAcc + 'm<br><span class="gpssmall">잠시만 기다리면 더 안정적인 값으로 판정합니다.</span>');

      // 충분히 좋은 값이면 5초 이후 조기 완료
      if(Date.now() - started > 5000 && bestAcc <= 8) finish();
    },
    err => {
      let msg = '위치 정보를 가져오지 못했습니다.';
      if(err.code === 1) msg = '위치 권한이 거부되었습니다. 브라우저/휴대폰 설정에서 위치 권한을 허용해 주세요.';
      if(err.code === 2) msg = '현재 위치를 확인할 수 없습니다. GPS 신호가 약할 수 있습니다.';
      if(err.code === 3) msg = '위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.';
      updateGpsBox('<b>GPS 오류</b><br>' + msg);
      if(gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );

  setTimeout(finish, 8500);
}

</script>

// === 수상레저활동 금지구역 v77 ===
// 기준: 서울시 고시 위치도 기반 1차 좌표화. 잠실대교 상류 및 한강버스 위험구역은 제외.
// 주의: 법정측량 좌표가 아닌 고시 첨부 위치도 기반 근사 폴리곤입니다.
function makeBandFeature(id, name, description, startLng, startLat, endLng, endLat, widthM){
  const midLat = (startLat + endLat) / 2;
  const mx = metersPerDegLng(midLat), my = metersPerDegLat();
  const sx = startLng * mx, sy = startLat * my;
  const ex = endLng * mx, ey = endLat * my;
  const dx = ex - sx, dy = ey - sy;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const half = widthM / 2;
  function unproj(x, y){ return [x / mx, y / my]; }
  const p1 = unproj(sx + nx * half, sy + ny * half);
  const p2 = unproj(ex + nx * half, ey + ny * half);
  const p3 = unproj(ex - nx * half, ey - ny * half);
  const p4 = unproj(sx - nx * half, sy - ny * half);
  return {
    type:'Feature',
    properties:{
      id:id,
      name:name,
      description:description,
      law:'수상레저안전법 제30조',
      source:'서울시 고시 위치도 기반 1차 좌표화',
      accuracy_note:'공식 GIS 원본이 아닌 고시 첨부도면 기반 근사 좌표'
    },
    geometry:{type:'Polygon', coordinates:[[p1,p2,p3,p4,p1]]}
  };
}
